is currently being prepared by our team.\n\nProgress:\n✓ Order received\n✓ Payment confirmed\n→ Preparing for shipment (You are here)\n○ Shipped\n○ Delivered\n\nEstimated Ship Date: [Date]\n\nYou'll receive a shipping notification with tracking info as soon as your order ships. No action needed from you - we're on it!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>4. 发货通知\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订单发货后通知客户\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Exciting news - your order is on its way!\n\nShipment Details:\n• Order: #[Order Number]\n• Tracking: [Tracking Number]\n• Carrier: [Carrier Name]\n• Track here: [Tracking Link]\n\nEstimated Delivery: [Date Range]\n\nTracking Tips:\n• Tracking may take 24-48 hours to update after shipment\n• You can track your package in real-time using the link above\n• We'll also send updates as your package moves\n\nIf you have any questions about your shipment, just reply to this message. Happy unboxing!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>5. 物流追踪查询\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问物流状态\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'd be happy to help you track your order #[Order Number].\n\nCurrent Status: [Status]\nLocation: [Current Location]\nLast Update: [Date/Time]\n\nHow to Track:\n1. Click this link: [Tracking Link]\n2. Or visit [Carrier Website] and enter: [Tracking Number]\n3. Or log into your account at [Store URL]/account\n\nEstimated Delivery: [Date]\n\nTracking updates every 12-24 hours. If you don't see updates for more than 3 days, please let me know and I'll investigate with the carrier.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>6. 订单修改处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要求修改订单信息\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'd be happy to help modify your order #[Order Number].\n\nCurrent Status: [Status]\n\nWhat We Can Do:\n[If not shipped yet]\n✓ Change items or quantities\n✓ Update shipping address\n✓ Apply discount code\n✓ Cancel the order\n\nTo proceed, please confirm:\n1. What changes would you like to make?\n2. [If address change] New shipping address?\n\nI'll process your request right away once confirmed. If your order has already shipped, we can arrange modifications upon delivery.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>7. 地址变更处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要求修改收货地址\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I can help update the shipping address for order #[Order Number].\n\nCurrent Address: [Current address]\n\n[If not shipped]\nGreat news! Your order hasn't shipped yet. I've updated your shipping address to:\n[New Address]\nYour order will be delivered to this new address.\n\n[If already shipped]\nYour order has already shipped. I've contacted [Carrier] to request an address change. Please note:\n• Address changes may take 24-48 hours to process\n• There may be a small redirect fee\n• I'll confirm once the change is complete\n\nIs there anything else I can help you with?\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>8. 订单取消处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要求取消订单\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand you'd like to cancel order #[Order Number].\n\n[If not shipped]\nI've cancelled your order as requested. Here's what happens next:\n• Refund amount: [Amount]\n• Refund method: Original payment method\n• Processing time: 5-7 business days\n• You'll receive a confirmation email shortly\n\n[If already shipped]\nYour order has already shipped. Here are your options:\n• Option A: Refuse delivery when it arrives (free)\n• Option B: Return it after delivery for a full refund\n\nI'm sorry to see you go! If there's anything we could have done better, please let us know. We'd love to serve you again in the future.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>9. 发货延迟说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订单发货延迟需要解释\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I wanted to reach out about your order #[Order Number].\n\nI sincerely apologize - there's been a delay in shipping your order.\n\nReason: [Delay Reason]\nOriginal Ship Date: [Date]\nNew Ship Date: [Date]\n\nWhat We're Doing:\n• Prioritizing your order for the next shipment\n• Upgrading to express shipping at no extra cost\n• Keeping you updated every step of the way\n\nTo Make It Right:\nWe'd like to offer you [Compensation].\n\nIf you'd prefer to cancel for a full refund, I completely understand and can process that immediately. Please let me know how you'd like to proceed.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>10. 国际订单清关说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 国际订单清关状态说明\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Here's an update on your international order #[Order Number].\n\nCurrent Status: In Customs Clearance\nLocation: [Country/City]\n\nWhat This Means:\nYour package is going through standard customs inspection. This is normal for international shipments and typically takes 2-5 business days.\n\nWhat You May Need to Do:\n• Customs may contact you for additional documentation\n• Import duties/taxes may apply (varies by country)\n• Keep your phone/email accessible for customs notifications\n\nEstimated Delivery: [Date Range] (after customs clearance)\n\nNeed Help?\nIf customs requests any documents, let me know and I'll provide whatever you need. We're monitoring your shipment and will update you on any changes.\n\nThank you for your patience with international shipping!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>主动沟通\u003c/strong>：不要等客户来问，主动发送订单状态更新\u003c/p>\n\u003cp>2. \u003cstrong>信息完整\u003c/strong>：订单确认要包含所有关键信息\u003c/p>\n\u003cp>3. \u003cstrong>提供链接\u003c/strong>：给出可点击的追踪链接，而不只是追踪号\u003c/p>\n\u003cp>4. \u003cstrong>管理预期\u003c/strong>：说明追踪更新频率和可能的延误情况\u003c/p>\n\u003cp>5. \u003cstrong>品牌化表达\u003c/strong>：在话术中融入品牌元素，体现独立站特色\u003c/p>\n\u003chr />\n\u003cp>\u003cstrong>更多快语AI话术模板：\u003c/strong> [https://www.talkq.vip/templates/](https://www.talkq.vip/templates/)\u003c/p>"},{"id":"platforms/shopify/aftersales","path":"platforms/shopify/aftersales.md","title":"Shopify 独立站售后客服话术","group":"platforms","groupLabel":"平台话术","categoryLabel":"Shopify · 售后","html":"\u003ch1>Shopify 独立站售后客服话术\u003c/h1>\n\u003cblockquote>专业的 Shopify 独立站售后客服话术模板，涵盖退换货处理、质量问题、退款处理、评价引导等售后服务场景。\u003c/blockquote>\n\u003ch2>使用说明\u003c/h2>\n\u003cul>\n\u003cli>话术中的 \u003ccode>[变量]\u003c/code> 需要根据实际情况替换\u003c/li>\n\u003cli>独立站售后是建立品牌忠诚度的关键机会\u003c/li>\n\u003cli>主动提供补偿方案，化危机为复购机会\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2>Shopify 售后话术列表（共 30 条）\u003c/h2>\n\u003ch3>1. 退货政策说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户咨询退货流程\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Our return policy: 30-day return window from delivery date. Items must be unused with original tags/packaging. Free returns for defective items. Customer pays return shipping for change of mind.\n\nTo start a return:\n1) Log into your account\n2) Go to Orders\n3) Select &quot;Return Item&quot;\n4) Print return label\n\nRefund processed within 5-7 days after we receive the item. Questions? We're here to help!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>2. 退货流程指导\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 指导客户完成退货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Here's how to return your order #[Order Number]:\n\nStep 1: Request return in your account (Orders → Return Item)\nStep 2: Select reason and items to return\nStep 3: Print the prepaid return label (or pay for return shipping)\nStep 4: Pack items securely with all tags/accessories\nStep 5: Drop off at [Carrier location]\n\nOnce we receive and inspect the return, your refund will be processed within 5-7 business days.\n\nTrack your return: [Link]\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>3. 换货处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户申请换货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'd be happy to help with an exchange for order #[Order Number]!\n\nWhat would you like to exchange: [Item] for [New item/size/color]?\n\nProcess:\n1) We'll send the new item right away\n2) Return the original item using the prepaid label\n3) No charge if same price; price difference will be charged/refunded\n\nNew item ships within 24 hours! Estimated delivery: [Date].\n\nSound good?\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>4. 退款处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 通知客户退款进度\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Your refund for order #[Order Number] has been processed.\n\nRefund Details:\n• Amount: [Amount]\n• Method: [Original Payment Method]\n• Processing date: [Date]\n\nTimeline:\n• Credit/Debit card: 5-10 business days\n• PayPal: 3-5 business days\n• Shop Pay: 2-3 business days\n\nThe refund will appear as [Business name] on your statement. If you don't see it after this timeframe, please contact your bank/PayPal.\n\nThank you for your patience!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>5. 质量问题处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈商品有质量问题\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm very sorry to hear about the quality issue with order #[Order Number]. This is not the experience we want for our customers.\n\nPlease send us photos of:\n1) The defect/damage\n2) Product tag\n3) Packaging\n\nWe'll immediately:\n• Send a replacement (free expedited shipping) OR\n• Issue a full refund (keep the item)\n\nPlus, we'd like to offer you [Discount]% off your next order as an apology.\n\nWe truly apologize and will make this right!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>6. 商品不符处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 收到的商品与订单不符\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I apologize that the item you received doesn't match what you ordered.\n\nOrder #[Order Number]\n• Ordered: [Item A]\n• Received: [Item B]\n\nThis is our mistake. Here's what we'll do:\n1) Send you the correct item immediately (free expedited shipping)\n2) You can keep or return the wrong item (your choice, free return label provided)\n3) [Discount/Store credit] for the inconvenience\n\nThe correct item will ship today. Tracking: [Link]\n\nAgain, our sincere apologies!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>7. 物流丢失处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈包裹丢失\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm sorry to hear your order #[Order Number] hasn't arrived.\n\nTracking shows: [Status]\nExpected delivery was: [Date]\n\nHere's what we'll do:\n1) File a claim with the carrier\n2) Meanwhile, we'll send you a replacement immediately (free expedited shipping) OR issue a full refund (your choice)\n\nYou won't need to wait for the carrier investigation.\n\nNew tracking: [Link]\n\nWe apologize for this inconvenience and appreciate your patience!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>8. 部分退款协商\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 协商部分退款解决问题\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand you'd like to keep the item but request a partial refund for order #[Order Number] due to [Reason].\n\nI appreciate you bringing this to our attention. Based on the issue, I can offer:\n\nOption 1: [X]% partial refund ([Amount])\nOption 2: [Y]% store credit ([Amount])\nOption 3: Full return for complete refund\n\nWhich option works best for you? We want to make sure you're satisfied with the resolution!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>9. 评价请求\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订单完成后引导好评\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! We hope you're enjoying your recent purchase from [Brand Name]!\n\nYour feedback means the world to us and helps other customers make informed decisions.\n\nWould you mind taking 2 minutes to leave a review?\n[Review link]\n\nAs a thank you, we'd like to offer you [Incentive].\n\nThank you for being an amazing customer. We truly appreciate your support!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>10. 复购优惠券发放\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 售后完成后发放复购优惠\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for being a valued customer. We'd love to see you again!\n\nHere's an exclusive offer just for you:\n• Code: [WELCOMEBACK20]\n• Discount: 20% off your next order\n• Valid until: [Date]\n• Minimum purchase: [Amount]\n\nPlus, check out our new arrivals: [Link]\nFree shipping on orders over [Amount]\n\nShop now: [Store link]\n\nWe look forward to serving you again!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>11. WISMO 延迟安抚\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反复追问订单何时送达\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I completely understand why you're checking in on order #[Order Number].\n\nLatest Tracking Update:\n• Current status: [Status]\n• Last scan: [Date/Time]\n• Carrier: [Carrier Name]\n• Updated delivery estimate: [Date]\n\nAt the moment, the package is still moving through the carrier network, but the tracking has been slower than expected. We're actively monitoring it for you.\n\nIf there is no new movement by [Follow-up Date], we'll open a carrier investigation and discuss the next best solution with you right away.\n\nThank you for your patience. I know delays are frustrating, and we're staying on top of this for you.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>12. 预售订单延期说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 预售或补货商品出库延期\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm reaching out with an update on your preorder/backorder item in order #[Order Number].\n\nOriginal ship date: [Original Date]\nNew ship date: [New Date]\nReason: [Reason]\n\nWe know this delay is disappointing, and we're very sorry. Your order is still reserved and will be fulfilled in priority sequence once stock is ready.\n\nIf you'd rather not wait, we can also help with:\n• Switching to a similar in-stock item\n• Converting the value to store credit\n• Cancelling for a full refund\n\nPlease let me know which option you prefer.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>13. 包裹显示已送达但客户未收到\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户称物流显示 delivered 但实际未收到\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm sorry to hear that order #[Order Number] shows as delivered but hasn't reached you yet.\n\nPlease try these quick checks first:\n1) Check around your mailbox, front desk, porch, or side entrance\n2) Ask household members or neighbors whether they accepted it\n3) Wait 24 hours, as some carriers mark packages delivered slightly early\n\nIf it still doesn't appear after [Timeframe], reply here and we'll help you open a carrier trace and review the best next step, such as a replacement or refund based on the investigation.\n\nWe'll do our best to help resolve this quickly.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>14. 物流停滞超过 3 天\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 跟踪长时间无更新，需要主动解释\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I checked order #[Order Number], and I can confirm the tracking has not updated since [Date].\n\nCurrent carrier status: [Status]\nTracking number: [Tracking Number]\n\nThis usually means the package is waiting for the next carrier scan or transfer between hubs. We've already flagged it for follow-up.\n\nOur next step:\n• Monitor for a fresh scan within [Timeframe]\n• Contact the carrier if there is still no movement\n• Offer a replacement or refund if the shipment is confirmed lost\n\nI'll keep you posted as soon as we have another update.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>15. 拒收退回说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户想拒收包裹并了解退款时间\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! If you'd like to refuse delivery for order #[Order Number], that's okay.\n\nPlease note:\n• Refused packages are sent back by the carrier\n• Refunds are usually processed after the return is marked received\n• Return transit time depends on the carrier and destination\n\nOnce the package is returned to us, we'll review it and process your refund to [Original Payment Method]. I'll be happy to help track the return progress for you if needed.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>16. 地址错误导致退回\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 包裹因地址问题被退回仓库\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I checked order #[Order Number], and it looks like the shipment is being returned due to an address issue.\n\nCarrier note: [Carrier Note]\n\nWe can help in either of these ways:\n• Reship the order to the corrected address: [New Address]\n• Cancel the order and issue a refund once the return is received\n\nPlease confirm your preferred option, and we'll handle it from there as quickly as possible.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>17. 退款已发起但银行未到账\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户说退款状态显示成功但账户没收到\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I checked order #[Order Number], and your refund was processed on [Date].\n\nRefund summary:\n• Amount: [Amount]\n• Method: [Payment Method]\n• Reference: [Reference ID if available]\n\nEven after a refund is issued on our side, banks and payment providers may need [Timeframe] to post it to your account.\n\nIf you still don't see it after that window, please contact your payment provider with the refund date above, and let us know if you'd like us to provide confirmation details.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>18. 退货已收到待质检\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问退货包裹已送达后为何还未退款\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thanks for checking in on your return for order #[Order Number].\n\nOur system shows the return package was delivered on [Date], and it is currently waiting for inspection.\n\nNext steps:\n• Return inspection: [Timeframe]\n• Refund processing: [Timeframe]\n• Final posting to your account: depends on your payment provider\n\nWe understand you're waiting on the refund, and we'll move it through as quickly as possible. If you'd like, I can also help monitor the case and update you once the inspection is complete.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>19. 店铺信用补偿\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 不适合现金退款时提供 store credit\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm sorry again for the inconvenience with order #[Order Number].\n\nTo help make this right, we can offer store credit of [Amount], which you can use toward any future purchase on our site.\n\nStore credit details:\n• Amount: [Amount]\n• Valid until: [Date]\n• Applies to: [Eligible Products or Conditions]\n\nIf you'd prefer a different solution, such as a return or partial refund, let me know and I'll walk through the options with you.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>20. 换货缺货替代推荐\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户想换货，但原款缺货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I checked the exchange request for order #[Order Number], and the requested replacement item is currently out of stock.\n\nHere are the best alternatives:\n• Option 1: [Alternative Product A]\n• Option 2: [Alternative Product B]\n• Option 3: Wait for restock around [Restock Date]\n\nIf none of these work for you, we can also proceed with a full return and refund.\n\nPlease tell me which option you'd prefer, and I'll take care of the next step for you.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>21. 发货前取消订单\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要求在包裹发出前取消整单或部分商品\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thanks for reaching out about order #[Order Number].\n\nI've checked the fulfillment status: [Not yet shipped / Partially shipped].\n\nIf the order (or the items you mentioned) has not shipped yet, I can cancel it for you and issue a refund to your original payment method. Refunds usually post within [Timeframe].\n\nIf anything has already shipped, we'll need to use the normal return process once you receive it. Please confirm which items you want to cancel, and I'll take care of the next step.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>22. 拆单发货 / 第二件仍在途\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 一单多件，客户只收到部分包裹（WISMO）\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thanks for your message about order #[Order Number].\n\nYour order was split into multiple shipments:\n• Delivered: [Carrier + tracking] — delivered on [Date]\n• Still in transit: [Carrier + tracking] — estimated delivery [Date]\n\nSometimes packages arrive 1–2 days apart. If the second package does not move for [Timeframe] or misses the estimated date, message us with your order number and we'll help investigate and update you.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>23. 取件失败 / 重新预约上门取件\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 退货已生成 label，但快递员未取件或取件失败\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm sorry for the trouble with the return pickup for order #[Order Number].\n\nReturn label: [Label ID or link]\nOriginal pickup date: [Date]\n\nI can help reschedule pickup for [New date/time window]. Please make sure someone is available at [Address] and the package is sealed with the label attached.\n\nIf pickup continues to fail, we can switch to a drop-off option at [Location/link]. Let me know what works best for you.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>24. 危险品或限制类退货说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 含电池、喷雾等，无法提供预付退货运单\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thanks for contacting us about the return for order #[Order Number].\n\nBecause this item contains [Restricted Material], carrier rules may require special handling. In some cases we cannot issue a standard prepaid label.\n\nHere are the safest options we can offer:\n• Option A: [Return Instructions]\n• Option B: [Resolution Option] if a return is not feasible\n\nPlease confirm which option you prefer, and we'll guide you through the exact steps.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>25. 礼品退货无订单号\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 收礼人没有购买者邮箱或订单信息\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Happy to help with a gift return.\n\nTo locate the order, please share any details you have:\n• Gift giver's name (if comfortable)\n• Shipping address used for delivery\n• Approximate order date\n• Product name/SKU and a photo of the packing slip (if available)\n\nIf we can verify the purchase, we'll provide return instructions. If we cannot match it, the original purchaser may need to start the return from their account — I can share the quickest steps for that as well.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>26. 仓库已收货但退款未入账\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 物流显示退货妥投，客户尚未看到退款\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thanks for your patience regarding order #[Order Number].\n\nI can confirm the return carrier shows delivered on [Date]. Our warehouse is currently processing received returns within [Timeframe].\n\nOnce inspection is complete, your refund of [Amount] will be issued to your original payment method. You'll receive an email confirmation when it's submitted.\n\nIf you don't see movement after [Follow-up Date], reply here and I'll escalate the case for you.\u003c/pre>\u003c/div>\n\u003chr /> ction.\n\nI'll keep monitoring this for you. 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>12. 退货标签无法使用\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家反馈退货标签无法打印、无法扫码或网点不接收\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Sorry the return label is not working! We'll help you fix it.\n\nPlease try:\n1) Reopen the return page in the Temu app\n2) Download the latest label\n3) Show the barcode at [Drop Off Location]\n\nIf it still fails, send us a screenshot of the error. We will request a new label or guide you to another return method.\n\nYour return window remains protected until [Return Deadline].\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>13. 重复退款申请说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家重复申请退款或担心退款未提交成功\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I checked your case for order [Order Number]. Your refund request is already submitted.\n\nCurrent refund status: [Refund Status]\nAmount: $[Amount]\nExpected processing time: [Time]\n\nSubmitting another request may slow down the review, so please keep this one active. If the status does not change by [Follow-up Date], we will escalate it for you.\n\nThank you for waiting. 🙏\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>14. 多件商品部分损坏\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 一个订单里多件商品，只有部分商品损坏或缺陷\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry part of your order arrived damaged.\n\nPlease send photos of:\n1) The damaged item\n2) The shipping package\n3) The item label or SKU\n\nFor the affected item [Product Name], we can offer:\n• Partial refund: $[Amount]\n• Replacement if stock is available\n• Full return if you prefer\n\nThe other items do not need to be returned if they are fine.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>15. 优惠 hot this so you don't forget! Thank you for supporting our small business! 🙏\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>10. 新品预告\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 预告即将上新的产品\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>👀 SNEAK PEEK! We're dropping a NEW [Product Type] next week! Turn on post notifications so you don't miss the launch! It's going to be [Feature/Benefit]. Drop a 🔥 if you're excited! Early birds get [Discount]% off! Save this video!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>快速响应\u003c/strong>：直播和评论区要秒回，使用快捷回复软件\u003c/p>\n\u003cp>2. \u003cstrong>亲切互动\u003c/strong>：使用轻松活泼的语气，符合 TikTok 年轻化氛围\u003c/p>\n\u003cp>3. \u003cstrong>引导下单\u003c/strong>：提供购物车链接，简化购买流程\u003c/p>\n\u003cp>4. \u003cstrong>制造紧迫感\u003c/strong>：强调限时优惠、库存紧张，促进即时下单\u003c/p>\n\u003cp>5. \u003cstrong>使用 emoji\u003c/strong>：适当使用表情符号，增加亲和力\u003c/p>\n\u003chr />\n\u003cp>\u003cstrong>更多快语AI话术模板：\u003c/strong> [https://www.talkq.vip/templates/](https://www.talkq.vip/templates/)\u003c/p>"},{"id":"platforms/tiktok-shop/sales","path":"platforms/tiktok-shop/sales.md","title":"TikTok Shop 售中客服话术","group":"platforms","groupLabel":"平台话术","categoryLabel":"TikTok Shop · 售中","html":"\u003ch1>TikTok Shop 售中客服话术\u003c/h1>\n\u003cblockquote>专业的 TikTok Shop 售中客服话术模板，涵盖订单确认、发货通知、物流追踪、订单修改等售中服务场景。\u003c/blockquote>\n\u003ch2>使用说明\u003c/h2>\n\u003cul>\n\u003cli>话术中的 \u003ccode>[变量]\u003c/code> 需要根据实际情况替换\u003c/li>\n\u003cli>TikTok 用户期待快速响应，建议配合快捷回复软件使用\u003c/li>\n\u003cli>主动通知比被动回复更能提升客户满意度\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2>1. 订单确认\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户下单后确认订单信息\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hey! 🎉 Thanks for your order! Order #[Order Number] is confirmed! We're packing it up now and will ship within [Time]. You'll get a tracking 3c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hey! So sorry for the delay! 🙏 [Reason for delay]. Your order is now being processed and will ship by [Date]. As a thank you for your patience, here's a [Discount]% off code for your next order: [Code]. We really appreciate you! 💕\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>7. 催单处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户催促发货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Totally understand! 🏃‍♀️ Let me check on your order right now! Order #[Order Number] is [Status]. We're working to get it out ASAP! You'll receive tracking info within [Time]. Thanks so much for your patience! 🙏\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>8. 预计送达时间\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问送达时间\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Great question! 📅 Based on your location, estimated delivery is [Date Range]. Standard shipping takes [X-Y] days. Once shipped, you'll get real-time tracking updates! Want faster delivery? We also offer express shipping! ⚡\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>9. 订单取消\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要求取消订单\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>No problem! 👍 I can help you cancel order #[Order Number]. Since it hasn't shipped yet, I'll process the cancellation now. Refund will be back to your original payment method within [Time] days. Changed your mind? You're always welcome back! 💕\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>10. 支付问题处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户遇到支付失败\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Oh no! 😅 Payment issues can happen sometimes. Try these: 1) Check your card details 2) Make sure you have enough balance 3) Try a different payment method. If it still doesn't work, screenshot the error and send it to me - I'll help you figure it out! 💪\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>主动通知\u003c/strong>：在关键节点（下单、发货、送达）主动通知客户\u003c/p>\n\u003cp>2. \u003cstrong>快速响应\u003c/strong>：TikTok 用户习惯快速沟通，响应速度影响满意度\u003c/p>\n\u003cp>3. \u003cstrong>亲切语气\u003c/strong>：保持轻松活泼的风格，符合平台调性\u003c/p>\n\u003cp>4. \u003cstrong>提供解决方案\u003c/strong>：遇到问题时主动提供补偿或替代方案\u003c/p>\n\u003cp>5. \u003cstrong>使用 emoji\u003c/strong>：适当使用表情符号，增加亲和力\u003c/p>\n\u003chr />\n\u003cp>\u003cstrong>更多快语AI话术模板：\u003c/strong> [https://www.talkq.vip/templates/](https://www.talkq.vip/templates/)\u003c/p>"},{"id":"platforms/tiktok-shop/aftersales","path":"platforms/tiktok-shop/aftersales.md","title":"TikTok Shop 售后客服话术","group":"platforms","groupLabel":"平台话术","categoryLabel":"TikTok Shop · 售后","html":"\u003ch1>TikTok Shop 售后客服话术\u003c/h1>\n\u003cblockquote>专业的 TikTok Shop 售后客服话术模板，涵盖退换货处理、质量问题、差评处理、评价引导等售后服务场景。\u003c/blockquote>\n\u003ch2>使用说明\u003c/h2>\n\u003cul>\n\u003cli>话术中的 \u003ccode>[变量]\u003c/code> 需要根据实际情况替换\u003c/li>\n\u003cli>售后问题要共情先行，让客户感受到被理解\u003c/li>\n\u003cli>主动提供解决方案，给客户选择权\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2>1. 退换货政策\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户咨询退换货规则\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hi! 👋 We offer [X]-day hassle-free returns! Items must be unused with original packaging. Here's how: 1) Go to your orders 2) Click &quot;Return&quot; 3) Ship it back with the label we provide. Refund processes within [X] days after we receive it! Easy peasy! 📦\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>2. 退货申请处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 批准客户退货申请\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Got it! ✅ Your return request is approved! Here's your return label: [Link]. Please ship within [X] days. Once we receive it, refund will be processed in [X] business days. Need help with anything else? We're here for you! 💕\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>3. 质量问题处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈商品有质量问题\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Oh no, we're SO sorry about this! 😔 This is definitely not up to our standards. Please send me a photo/video of the issue. I'll get you a full refund OR replacement right away - your choice! No need to return the item. We really appreciate your patience! 🙏\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>4. 商品不符处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 收到的商品与描述不符\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>We're so sorry for the mix-up! 😅 That's totally our mistake. I'm sending out the correct item TODAY with express shipping - no extra charge! Keep the wrong item as our apology gift. You'll get tracking info shortly. So sorry again! 💕\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>5. 差评挽回\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户留下差评后主动联系\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hi! We saw your review and we're really sorry about your experience. 😔 We'd love to make this right! Can I offer you [Full refund/Replacement/Store credit]? Your satisfaction means everything to us. Please give us a chance to fix this! 🙏\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>6. 评价引导\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订单完成后引导好评\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hey! 💕 Hope you're loving your [Product]! If you have a moment, we'd really appreciate a review - it helps other shoppers and supports our small business! 🙏 Got any issues? Message us first and we'll make it right! Thank you so much! ⭐\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>7. 退款处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 通知客户退款进度\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Good news! 💰 Your refund of $[Amount] has been processed! It'll be back in your account within [X] business days depending on your bank. You'll get a confirmation email too. Thanks for your patience! Hope to see you again! 💕\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>8. 换货处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户申请换货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>No problem! 🔄 I'll send out the replacement [Size/Color] right away! You'll get tracking within 24 hours. For the original item, use this return label: [Link]. Once we receive it, you're all set! Thanks for giving us a chance to make it right! 💪\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>9. 部分退款\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 协商部分退款解决问题\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I totally understand your frustration. 😔 While we can't do a full return, I'd like to offer you a [X]% partial refund ($[Amount]) as compensation. You can keep the item too! Does that work for you? We really want to make this right! 🙏\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>10. 客户回访\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订单完成后回访客户\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hey! 👋 Just checking in - how's your [Product] working out? Everything good? If you love it, we'd be SO grateful for a quick review! ⭐ If anything's not perfect, let me know and I'll fix it ASAP! Thanks for being part of our TikTok family! 💕\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>11. 直播展示差异说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户认为实物与直播间展示效果不同\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Thanks for sharing this with us. I understand the item may look different from what you saw during the livestream.\n\nLighting, camera filters, and screen settings can change how [Product Name] appears, but we still want you to feel confident about your purchase.\n\nPlease send:\n1) A photo of the item received\n2) A screenshot or clip from the livestream if available\n3) Your order number [Order Number]\n\nWe'll review and offer the best solution: return, exchange, or partial refund where eligible.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>12. 达人优惠码预期差异\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户使用达人/主播优惠码后，认为优惠金额不对\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I can help check the creator code discount for you.\n\nPlease confirm:\n• Code used: [Creator Code]\n• Order number: [Order Number]\n• Expected discount: [Expected Discount]\n• Actual discount: [Actual Discount]\n\nSome codes apply only to selected items, first-time buyers, or a minimum order amount. If the code should have applied, we'll help escalate or offer a store voucher for the difference where possible.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>13. 套装缺件处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈直播套装或组合包少发某个配件\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>We're sorry one item from your bundle is missing.\n\nPlease send:\n1) A photo of everything received\n2) A photo of the packing slip\n3) Order number [Order Number]\n\nMissing item: [Missing Item]\n\nOnce confirmed, we can send the missing item if stock is available, or issue a partial refund of $[Amount].\n\nThanks for helping us verify this quickly.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>14. 退款到账时间解释\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户看到 TikTok Shop 显示已退款，但银行卡或钱包尚未到账\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Your refund has been approved on TikTok Shop.\n\nRefund details:\n• Amount: $[Amount]\n• Refund method: [Payment Method]\n• Approved date: [Date]\n• Bank processing time: [Time]\n\nTikTok Shop has released the refund, but the final posting time depends on your bank or wallet provider. If it is still missing after [Follow-up Date], send us a screenshot and we'll help you check again.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>15. 爆款缺货取消安抚\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 爆款或直播款售罄导致订单取消或无法补发\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm really sorry. [Product Name] sold out faster than expected after the campaign, so we cannot ship a replacement right now.\n\nAvailable options:\n1) Full refund to your original payment method\n2) Store voucher: [Voucher Amount]\n3) Restock reminder for [Restock Date]\n\nWe understand this is disappointing, especially after ordering during the live event. We'll prioritize notifying you when the item returns.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>共情先行\u003c/strong>：先表达理解和歉意，再提供解决方案\u003c/p>\n\u003cp>2. \u003cstrong>给予选择\u003c/strong>：提供 2-3 个解决方案让客户选择\u003c/p>\n\u003cp>3. \u003cstrong>快速响应\u003c/strong>：售后问题响应越快，客户满意度越高\u003c/p>\n\u003cp>4. \u003cstrong>主动补偿\u003c/strong>：适当提供优惠券或折扣，挽回客户信任\u003c/p>\n\u003cp>5. \u003cstrong>跟进回访\u003c/strong>：问题解决后主动回访，争取好评\u003c/p>\n\u003chr />\n\u003cp>\u003cst 制话术\u003c/button>\u003cpre>Your package is in customs clearance. 🛃\n\nThis is normal for international orders!\n\nDetails:\n• Clearance time: [Time] days\n• Current status: [Status]\n• No action needed from you\n\nOnce cleared, delivery continues immediately.\n\nWe're monitoring it. Thank you for your patience! 🌍\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>8. 催单处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家催促发货/送达\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>We understand you're eager to receive your order! 🤗\n\nOrder Status:\n• Current status: [Status]\n• Shipped on: [Date]\n• Current location: [Location]\n• ETA: [Date]\n\nWe've flagged this as priority. Your package is on its way!\n\nTracking: [Number]\n\nAlmost there! 🚚\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>9. 订单修改\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家要求修改订单内容\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Need to modify your order? Let me check!\n\nIf status is &quot;Processing&quot;, we can change:\n✓ Size/Color\n✓ Quantity\n✓ Shipping address\n\nPlease tell me:\n1) Order ID\n2) What to change\n\nIf already shipped, you can return/exchange after delivery.\n\nWe'll do our best! ⚡\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>10. 配送确认\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 确认包裹已送达\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Your package should have arrived! 📬\n\nTracking shows: Delivered on [Date]\n\nPlease check:\n• Your mailbox\n• Front door/porch\n• With neighbors\n• Building reception/mailroom\n\nReceived it? We hope you love it! Please leave a review! ⭐\n\nNot received? Contact us immediately and we'll help! 💬\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>主动通知\u003c/strong>：发货后立即通知，不要等买家来问\u003c/p>\n\u003cp>2. \u003cstrong>清关说明\u003c/strong>：国际订单常有清关，提前说明\u003c/p>\n\u003cp>3. \u003cstrong>准时保障\u003c/strong>：Wish 有准时送达保障，注意时效\u003c/p>\n\u003cp>4. \u003cstrong>多渠道追踪\u003c/strong>：引导买家通过 Wish App 追踪\u003c/p>\n\u003cp>5. \u003cstrong>快速响应\u003c/strong>：订单修改要快速处理\u003c/p>\n\u003chr />\n\u003cp>\u003cstrong>更多快语AI话术模板：\u003c/strong> [https://www.talkq.vip/templates/](https://www.talkq.vip/templates/)\u003c/p>"},{"id":"platforms/wish/aftersales","path":"platforms/wish/aftersales.md","title":"Wish 售后客服话术","group":"platforms","groupLabel":"平台话术","categoryLabel":"Wish · 售后","html":"\u003ch1>Wish 售后客服话术\u003c/h1>\n\u003cblockquote>专业的 Wish 低价跨境电商售后客服话术模板，涵盖退换货处理、质量问题、包裹丢失、评价引导等售后服务场景。\u003c/blockquote>\n\u003ch2>使用说明\u003c/h2>\n\u003cul>\n\u003cli>话术中的 \u003ccode>[变量]\u003c/code> 需要根据实际情况替换\u003c/li>\n\u003cli>Wish 有买家保护政策，要善用平台保障\u003c/li>\n\u003cli>低价商品退货成本高，优先提供退款或补发\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2>Wish 售后话术列表（共 15 条）\u003c/h2>\n\u003ch3>1. 退货政策说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家咨询退货流程\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>30-Day Return Policy! 📦\n\nHow to Return:\nWish app → Order History → Request Return → Select reason\n\nProcess:\n• We provide return label\n• Refund processed within [Time] days after return received\n• Items must be unused with tags\n\nEasy returns! Questions? Ask us! ✨\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>2. 质量问题处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家反馈商品有质量问题\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>We're very sorry about the quality issue! 😔\n\nPlease send photos/videos of the defect.\n\nWe'll immediately:\n1) Issue full refund OR\n2) Send free replacement\n\nYou choose! No need to return defective item.\n\nWe apologize and will make it right! 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>3. 商品不符处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 收到的商品与描述不符\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Item not as described? We sincerely apologize! 🙏\n\nPlease send us photos showing the difference.\n\nOptions:\nA) Full refund + keep item\nB) Free replacement + return label\n\nYour choice! We value your trust!\n\nProtected by Wish buyer guarantee! 💝\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>4. 退款处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 通知买家退款进度\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Refund processing! 💰\n\nDetails:\n• Amount: $[Amount]\n• Method: [Original Payment Method]\n• Processing time: 5-10 business days\n\nYou'll receive confirmation via Wish app.\n\nCheck &quot;Order History&quot; for status.\n\nThank you for your patience! 🙏\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>5. 包裹未收到\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家反馈包裹丢失\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Package not received? We're sorry! 😢\n\nLet's resolve this:\n1) Check with neighbors/mailroom\n2) Verify address\n3) Contact carrier\n\nStill missing?\n\nWe'll:\n• Issue full refund OR\n• Send replacement immediately\n\nYou're protected! We'll make it right! 🛡️\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>6. 评价引导\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订单完成后引导好评\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Love your purchase? 💕\n\nWe'd appreciate a 5-star review! ⭐⭐⭐⭐⭐\n\nYour feedback:\n• Helps us grow\n• Helps other shoppers\n• Share photos for bonus!\n\nAny issues? Contact us first - we'll resolve it!\n\nThank you for supporting our small business! 🙏\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>7. 差评挽回\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家留下差评后主动联系\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hi! I noticed your feedback and I'm truly sorry about your experience. 😔\n\nI want to make this right!\n\nI can offer:\n• Full refund (keep the item)\n• Free replacement\n• Store credit for future purchase\n\nPlease give me a chance to fix this. If satisfied, would you consider updating your review?\n\nYour satisfaction is my priority! 🙏\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>8. 换货处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家申请换货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Need an exchange? No problem! 🔄\n\nProcess:\n1) Tell me what you'd like instead (size/color)\n2) I'll ship the new item immediately\n3) Return the original with our prepaid label\n\nOr: Get a refund and reorder the correct item.\n\nWhich option works better for you? Let me know! 💬\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>9. 部分退款\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 协商部分退款解决问题\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I understand your concern. 🤔\n\nSince return shipping can be expensive, I'd like to offer:\n\nOption 1: [X]% partial refund ($[Amount]) - keep the item\nOption 2: Full refund with return\n\nMy recommendation: Option 1 gives you the best value!\n\nWhich works for you? I want to find a fair solution! 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>10. 客户回访\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订单完成后回访客户\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hi! Just checking in! 👋\n\nHow's your [Product Name]? Is everything as expected?\n\nWe'd love to hear your feedback!\n\nHappy with it? A quick review would mean so much! ⭐\n\nAny issues? Let me know - I'm here to help!\n\nThanks for choosing us! 💜\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>11. 超长物流安抚\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> Wish 标准物流远超预计时效，买家担心包裹丢失\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Sorry the delivery is taking longer than expected! 😢\n\nOrder: [Order Number]\nTracking: [Tracking Number]\nLatest status: [Status]\nNew estimated delivery: [New ETA]\n\nWish standard shipping can take extra time in transit or customs. You're still covered by Wish buyer protection until [Protection End Date].\n\nIf there is no new update by [Follow-up Date], we can:\n• Issue a full refund\n• Send a replacement if stock is available\n\nHang tight - we'll make it right! 🛡️\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>12. 低价商品免退货退款\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 商品单价低、退货不划算，直接退款或补发\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>We're sorry about the issue with [Product Name]! 😔\n\nBecause return shipping can cost more than the item, you do not need to send it back.\n\nPlease choose:\n1) Full refund of $[Amount]\n2) Free replacement if stock is available\n3) Partial refund of $[Amount] and keep the item\n\nReply with your choice and we'll process it in the Wish app. 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>13. 无轨迹包裹核查\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订单已发货但长期没有有效物流轨迹\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Thanks for waiting! I checked order [Order Number] and tracking is not updating yet.\n\nCarrier: [Carrier]\nTracking number: [Tracking Number]\nShip date: [Date]\n\nSometimes Wish economy shipping updates late. If there is still no scan by [Follow-up Date], we will treat it as lost and help yo p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>We're sorry the product didn't meet your expectations! 😔\n\nReturn/Exchange policy:\n• Return window: [Days] days\n• Condition: Original packaging, unused/like-new\n• Refund method: [Original Payment Method]\n\nProcess:\n1) Request return in your order\n2) We'll send a prepaid shipping label\n3) Ship the item back\n4) Refund processed within [Days] days\n\nNeed an exchange instead? Let us know! 📦\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>14. 维修服务\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 产品需要维修\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>We can help with repairs! 🔧\n\nRepair options:\n• In-warranty: Free repair/replacement\n• Out-of-warranty: Repair fee $[Price]\n\nProcess:\n1) Contact us with issue description\n2) We'll provide RMA number\n3) Ship to our service center\n4) Repair time: [Days] days\n5) Return shipping included\n\nEstimated repair cost: $[Price]\nWant to proceed? 🛠️\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>15. 技术支持\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户需要技术帮助\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Happy to provide technical support! 💻\n\nFor faster assistance, please provide:\n• Product model\n• Serial number\n• Operating system (if applicable)\n• Detailed description of the issue\n• Screenshots/videos if possible\n\nSupport resources:\n• User manual: [Link]\n• FAQ: [Link]\n• Video tutorials: [Link]\n\nLet's solve this together! 🤝\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>16. 充电发热 / 温控说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户担心手机壳、充电器、笔电适配器发热是否正常\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thanks for checking in about warmth while charging/using [Product].\n\nIt's normal for [chargers/adapters/power banks] to feel warm under load, especially with fast charging. Please ensure:\n• Official or certified cable and adapter\n• Ventilation around the device (avoid pillows/blankets covering it)\n• Ambient temperature under [°C]\n\nIf it becomes very hot to touch, smells unusual, swells, or charging stops/starts repeatedly, stop use immediately and contact us with your order number and a short video if possible — we'll prioritize a replacement or refund under warranty.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>17. 品控瑕疵（异响、缝隙、坏点）投诉处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 耳机杂音、屏幕坏点、外壳缝隙等质量争议\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry your [Product] doesn't meet the quality you expected.\n\nTo resolve this quickly, please send:\n• A short description (when it happens / which area)\n• Photos or a 10–20s video if it's visual/audio\n\nWe'll confirm whether it matches our warranty policy and offer: [Repair / Replacement / Refund] within [Timeframe]. If it's within DOA window, we'll expedite shipping for you.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>18. 固件缺陷已知问题与补丁时间线\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 已知软件 bug，客户投诉功能不可用\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Thank you for reporting this issue with [Product] — we're aware some users are seeing [Symptom] on firmware [Version].\n\nCurrent status:\n• Workaround (if any): [Steps]\n• Target fix: [ETA or &quot;under validation&quot;]\n\nWe'll notify you when [Version] is released. If the workaround doesn't fit your use case, we can help with [Return window option / exchange] according to your order date and policy.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>19. 电池续航低于预期排查\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈电池耗电快、续航未达宣传预期\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry the battery life of [Product Name] feels lower than expected.\n\nBattery runtime depends on brightness, volume, signal, apps, and temperature. Please try:\n1) Fully charge to 100%\n2) Use [Recommended Mode]\n3) Test for [Hours] hours under normal use\n\nIf runtime is still far below [Expected Runtime], send us your usage details and order number. We'll help with troubleshooting or warranty next steps.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>20. 蓝牙连接不稳定处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈耳机、音箱、键盘等蓝牙断连或延迟\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Sorry about the Bluetooth connection issue with [Product Name]. Please try these steps:\n\n1) Forget the device in Bluetooth settings\n2) Restart both devices\n3) Pair again within [Distance]\n4) Test away from strong Wi-Fi or metal interference\n\nIf it still disconnects, please tell us your phone/computer model and system version so we can provide the right fix.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>21. 配件缺失补发\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户称包装内少线材、说明书、螺丝或转接头\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry an accessory was missing from your package.\n\nPlease send:\n• Order number: [Order Number]\n• Missing item: [Accessory Name]\n• Photo of everything received\n\nOnce confirmed, we'll ship the missing accessory to [Shipping Address] within [Timeframe]. Thank you for helping us verify it quickly.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>22. 兼容系统版本提醒\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户购买前或安装后询问系统版本兼容性\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>[Product Name] works best with [Supported System] version [Version] or above.\n\nBefore ordering or installing, please check:\n• Device model: [Device Model]\n• System version: [System Version]\n• Required port/app: [Requirement]\n\nIf you share your device details, I can confirm compatibility before you proceed.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>23. 数据丢失风险提醒\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 固件升级、重置、维修前提醒客户备份数据\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Before you perform [Action], please back up important data first.\n\nThis step may reset settings or remove local files depending on your device. Recommended backup:\n• Photos/files: [Backup Method]\n• App settings: [Backup Method]\n• Account login info: [Account]\n\nAfter backup, follow the steps in [Guide Link]. If you're unsure, message us before starting.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>24. 屏幕贴膜 / 保护壳适配说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问保护膜、手机壳、支架是否适配\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>For [Product Name], please check these fit points:\n\n• Device model: [Device Model]\n• Case or screen protector thickness: [Thickness]\n• Port/camera/button cutouts: [Cutout Type]\n\nIf you already use a third-party case or film, send a photo or model link and we'll help confirm fit before you order.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>25. 进水 / 受潮处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户设备进水、受潮、雨淋后询问能否继续使用\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>For safety, please power off [Product Name] immediately and do not charge it.\n\nNext steps:\n1) Wipe the outside dry\n2) Keep it in a dry, ventilated place\n3) Contact us with photos and what happened\n\nWater damage coverage depends on [Warranty Policy]. We'll review your case and suggest repair or replacement options.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>26. 物流挤压导致外观损伤\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户收到电子产品外壳压痕、包装破损但功能未知\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm very sorry the package arrived damaged.\n\nPlease do not discard the outer box yet. Send us:\n• Photos of the shipping box\n• Photos of the product damage\n• Whether the device powers on normally\n\nWe'll document the carrier issue and offer [Resolution Option] based on the damage and function check.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>27. 多设备切换说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问耳机、键盘、鼠标等如何连接多设备\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>[Product Name] supports [Connection Mode] for device switching.\n\nTo switch devices:\n1) Pair with Device A\n2) Pair with Device B\n3) Use [Switch Button/Shortcut] to toggle\n\nIf switching fails, disconnect from the previous device first and try again. Tell me your device models if you need exact steps.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>28. 发票 / 质保凭证说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要求发票、收据或质保凭证\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Sure — we can help with your purchase document.\n\nPlease provide:\n• Order number: [Order Number]\n• Invoice name: [Invoice Name]\n• Email address: [Email]\n\nWe'll send the receipt or warranty proof within [Timeframe]. Please keep it for future service requests.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>29. 海外插头 / 电压适配说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 跨境客户询问插头规格、电压、转接头\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>[Product Name] uses [Plug Type] and supports [Voltage Range].\n\nBefore ordering, please confirm your local outlet type. If your country uses a different plug, you may need [Adapter Type].\n\nIf you tell us your country or region, we'll confirm whether this version is suitable.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>30. 召回 / 安全通知沟通\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 需要通知客户停止使用某批次产品并安排处理\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Important safety notice for [Product Name]: please stop using units with batch code [Batch Code] until we complete verification.\n\nNext steps:\n1) Check the batch code at [Package Location]\n2) Send us a photo with your order number\n3) We will arrange [Replacement / Refund / Inspection]\n\nWe apologize for the concern and will prioritize your case.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>参数准确\u003c/strong>：电子产品参数要准确，避免误导客户\u003c/p>\n\u003cp>2. \u003cstrong>兼容性确认\u003c/strong>：主动确认兼容性，减少退换货\u003c/p>\n\u003cp>3. \u003cstrong>使用指导\u003c/strong>：提供详细的使用说明和教程链接\u003c/p>\n\u003cp>4. \u003cstrong>保修说明\u003c/strong>：清晰说明保修范围和流程\u003c/p>\n\u003chr />\n\u003cp>\u003cstrong>更多快语AI话术模板：\u003c/strong> [https://www.talkq.vip/templates/](https://www.talkq.vip/templates/)\u003c/p>"},{"id":"industries/fashion","path":"industries/fashion.md","title":"服装行业客服话术","group":"industries","groupLabel":"行业话术","categoryLabel":"服装行业","html":"\u003ch1>服装行业客服话术\u003c/h1>\n\u003cblockquote>专业的服装行业客服话术模板，涵盖尺码咨询、材质说明、搭配建议、退换货处理等全链路场景。\u003c/blockquote>\n\u003ch2>使用说明\u003c/h2>\n\u003cul>\n\u003cli>话术中的 \u003ccode>[变量]\u003c/code> 需要根据实际情况替换\u003c/li>\n\u003cli>服装行业 70% 的咨询集中在尺码、材质、搭配三大问题\u003c/li>\n\u003cli>建议配合快捷回复软件使用，提升响应速度\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch1>售前话术（5条）\u003c/h1>\n\u003ch2>1. 尺码咨询\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问尺码、不确定选哪个尺码\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hi! For sizing, please check our size chart in the product images. 📏 \nMeasurements: Bust: [Size] | Waist: [Size] | Hip: [Size] | Length: [Size]. \nThis item runs [true to size/small/large]. \nIf you're between sizes, we recommend sizing [up/down]. \nNeed help? Send us your measurements (height, weight, bust, waist, hip) and we'll recommend the perfect size! 👗\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>2. 材质说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问材质成分、是否起球、透气性等\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Material: [Material Composition]. \nFeatures: \n✓ [Feature 1] \n✓ [Feature 2] \n✓ [Feature 3]. \nCare instructions: [Washing instructions]. \nThis fabric is perfect for [Season/Occasion]. \nFeel: [Soft/Smooth/Textured]. \nQuestions about the material? Ask away! 🧵\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>3. 颜色说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问颜色、色差问题\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Available colors: [Color 1], [Color 2], [Color 3]. 🎨 \nPlease note: Colors may vary slightly due to screen settings. We've photographed the actual product! \nCurrent stock: [Color]: [Quantity] units. \nPopular choice: [Best-selling color]. \nNeed color advice? Tell us your skin tone/style and we'll recommend! 💕\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>4. 搭配建议\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问如何搭配\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Styling tips for this piece: 👗 \nCasual look: Pair with [Item 1] + [Item 2]. \nDressy look: Style with [Item 3] + [Item 4]. \nPerfect for: [Occasions]. \nTrending style: [Current trend]. \nCheck our store for matching accessories! \nNeed personalized styling advice? Share your style preferences! 💃\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>5. 版型说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问版型、是否修身\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Fit: [Slim fit/Regular fit/Loose fit/Oversized]. \nStyle: [Style description]. \nBest for body type: [Body type recommendations]. \nModel info: Height [Height], wearing size [Size]. \nThis design is [Flattering feature]. \nWant to see how it looks? Check our customer photos in reviews! \nQuestions about fit? Ask us! 👕\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch1>售中话术（5条）\u003c/h1>\n\u003ch2>6. 尺码确认\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 发货前确认客户选择的尺码\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Order confirmed! 🎉 \nJust double-checking: You ordered size [Size] in [Color]. \nBased on our size chart, this should fit: [Measurements]. \nIf you need to change the size before shipping, let us know ASAP! \nWe want to make sure you get the perfect fit! 📦\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>7. 颜色确认\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 发货前确认客户选择的颜色\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Your order: [Product Name] in [Color], Size [Size]. 🎨 \nPlease note: The actual color may vary slightly from the photo due to lighting/screen settings. \nWe've included the most accurate product photos. \nIf the color doesn't match your expectations upon arrival, we offer easy returns! 💝\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>8. 包装说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 说明包装方式、可能的褶皱问题\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Packaging info: Your item will arrive folded/rolled to minimize shipping costs and environmental impact. 📦 \nSome wrinkles are normal! Simply: \n1) Hang it up for 24 hours OR \n2) Steam/iron on low heat. \nIt'll look perfect! We've packed it with care! 🌟\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>9. 预售说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 预售商品的发货时间说明\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>This item is on pre-order! 🎉 \nExpected ship date: [Date]. \nWhy pre-order? [Preorder Reason]. \nYou'll receive: \n✓ Guaranteed stock \n✓ [Discount/Bonus] \n✓ Priority shipping. \nWe'll notify you when it ships! Thank you for your patience! 💕\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>10. 定制说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 定制商品的确认和说明\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Custom order confirmed! ✂️ \nYour specifications: \nSize: [Custom size] | Color: [Color] | Special requests: [Requests]. \nProduction time: [Time] days. \nWe'll send progress photos! \nCustom items are non-returnable unless defective. \nQuestions during production? Contact us anytime! 🎨\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch1>售后话术（5条）\u003c/h1>\n\u003ch2>11. 尺码不合适\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户收货后发现尺码不合适\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Size doesn't fit? No worries! 👗 \nWe offer FREE size exchanges! \nProcess: \n1) Request exchange in your order \n2) We'll send the new size \n3) Return the original (free label provided). \nOr get a full refund! \nPlease keep tags attached. We want you to love it! 💝\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>12. 颜色差异\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反映颜色与图片不符\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Color not as expected? We understand! 🎨 \nLighting and screens can affect color perception. \nIf you're not satisfied: \n1) Send us a photo \n2) We'll offer: Full refund OR Exchange for different color. \nReturn shipping on us! \nYour satisfaction is our priority! 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>13. 质量问题\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户收到有质量问题的商品\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>We're very sorry about the quality issue! 😔 \nPlease send photos of: \n1) The defect \n2) Product tag. \nWe'll immediately: Send replacement OR Full refund + keep the item. \nNo return needed for defective items! \nPlus [Discount] for your next order. We apologize! 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>14. 洗护建议\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问如何洗涤保养\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Care instructions for your garment: 🧺 \nWashing: [Washing Instructions]. \nDrying: [Drying Instructions]. \nIroning: [Ironing Instructions]. \nStorage: [Tips]. \nFollowing these will keep your item looking great! Questions? Ask us! ✨\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>15. 复购推荐\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户满意后推荐相关产品\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Love your purchase and want styling tips? 💕 \nThis piece pairs beautifully with: [Suggestions]. \nCheck our store for: \n✓ Matching accessories \n✓ Complementary items \n✓ Complete the look sets. \nShare your styled photos and tag us - we might feature you! \nNeed personal styling advice? DM us! 👗\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>16. 色差投诉（光线与显示器）说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户称实物颜色与图片差异大，需降级冲突、提供换货选项\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hi! I'm sorry the color didn't match what you imagined.\n\nWe photograph in [studio/natural] light, but monitors and phone screens can shift how colors look. If the item is unworn with tags, we can help with: [Exchange for another color] or [Return for refund] within [Days] days.\n\nIf you can share a photo of the item next to natural daylight, we can double-check whether it matches our QC reference. Either way, we'll make the return/exchange process simple.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>17. 预售多次延期道歉与补偿\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 预售款交期一再推迟，客户情绪激动\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm truly sorry — your preorder for [Item] has been delayed again. The revised ship date is now [Date], because [Reason: fabric delay / port / production].\n\nWe know this is frustrating. To make it right:\n• [Compensation]\n• You may also cancel for a full refund at any time before shipment — just say the word.\n\nIf you'd like to keep the order, we'll send a tracking link the moment it ships and prioritize your package.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>18. 洗涤后缩水是否质量问题\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户按说明洗涤后仍缩水，质疑面料或描述\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thanks for letting us know about shrinkage after washing.\n\nIf care instructions were followed ([Care Method]) and shrinkage is beyond normal tolerance for this fabric, we'll treat it as a quality issue: [Replacement / Refund / Partial refund].\n\nPlease share:\n• Photos with a ruler measurement (chest/length)\n• Which wash cycle and temperature you used\n\nIf care instructions weren't followed, we may not be able to cover it — but I'll still suggest [Resolution Option] if helpful.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>19. 面料扎皮 / 不亲肤反馈\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈衣物上身刺痒、面料不够柔软\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry the fabric of [Product Name] didn't feel comfortable on your skin.\n\nSome textures can feel different depending on skin sensitivity and layering. Please check whether the care label allows a gentle wash or steam to soften the fabric.\n\nIf it still feels irritating, we can help with [Resolution Option] within [Days] days, as long as the item meets return condition requirements.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>20. 透明 / 走光风险说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问白色、浅色或薄款服装是否透\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Great question about coverage. [Product Name] has [Fabric Thickness] fabric and is best worn with [Recommended Underlayer] for lighter colors.\n\nFor strong sunlight or flash photography, slight transparency may be possible. If you prefer more coverage, I recommend [Alternative Product].\n\nTell me the color and occasion, and I'll help you choose the safer option.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>21. 起球 / 勾丝处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈针织、毛衣、运动面料起球或勾丝\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry you noticed pilling or snagging on [Product Name].\n\nFor this fabric, minor pilling can happen with friction from bags, seats, or repeated washing. Please send photos of the affected area and tell us how many times it was worn or washed.\n\nWe'll review whether it is normal wear or a quality issue and offer [Resolution Option].\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>22. 拉链 / 纽扣损坏补救\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈拉链卡住、纽扣脱落、五金损坏\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry about the hardware issue on [Product Name].\n\nPlease send:\n• A close-up photo or short video\n• Your order number\n• Whether the item has been worn or washed\n\nIf confirmed, we can arrange [Replacement Part], [Repair Credit], or [Exchange Option] depending on availability.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>23. 套装上下身尺码不一致建议\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户购买套装但上衣和下装需要不同尺码\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>For [Set Name], I understand you may need different sizes for top and bottom.\n\nCurrent set sizing: top [Top Size], bottom [Bottom Size]. If mixed sizing is available, we can help arrange [Mixed Size Option].\n\nIf mixed sizing is not available, please share your measurements and fit preference, and I'll suggest the best single size or alternative set.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>24. 大码版型推荐\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 大码客户询问是否显瘦、是否适合自己的身形\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'd be happy to help with fit. For [Product Name], the key fit points are [Fit Points].\n\nIf you prefer a relaxed fit, consider [Recommended Size]. If you want a more shaped look, [Alternative Size] may work better.\n\nSend your bust, waist, hip, and height, and I'll recommend the most comfortable size.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>25. 退货运费争议说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户不满退货运费，需要解释规则并安抚\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I understand return shipping can be frustrating.\n\nFor [Return Reason], our policy is: [Return Shipping Policy]. If the item is defective or we shipped the wrong item, we'll cover the return cost.\n\nPlease send photos if there is a product issue, and I'll review whether we can upgrade this to a prepaid return label.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>26. 试穿后换码流程\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户试穿后想换尺码，需要明确流程\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>No problem — we can help you exchange [Product Name] for size [New Size].\n\nExchange steps:\n1) Keep tags attached and item unworn outside\n2) Start exchange within [Days] days\n3) Send the return package using [Return Method]\n\nOnce the return scan updates, we'll ship the replacement if stock is available.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>27. 色牢度 / 掉色提醒\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 深色牛仔、印花、染色面料需要洗护提醒\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>For [Product Name], we recommend washing dark or printed colors separately for the first [Wash Count] washes.\n\nCare tips:\n• Turn inside out\n• Use cold water\n• Avoid soaking for too long\n• Do not mix with light colors\n\nThese steps help protect color and reduce transfer.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>28. 身高体重快速推荐\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户只提供身高体重，需要快速初步尺码建议\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Based on height [Height] and weight [Weight], a good starting size for [Product Name] is [Recommended Size].\n\nFor a more accurate fit, please also share bust/chest, waist, and hip measurements. If you are between sizes, choose [Size Advice] depending on whether you prefer tight or relaxed fit.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>29. 断货替代款推荐\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户想买的颜色或尺码断货，需要挽回转化\u00
