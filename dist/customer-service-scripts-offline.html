3cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>For [Product Name], delivery is handled by [Carrier Type] and usually requires an appointment.\n\nProcess:\n1) Carrier receives the shipment\n2) They contact you at [Phone Number]\n3) You choose a delivery window\n\nPlease make sure the phone number and address are correct. If you need to change them, tell us before [Cutoff Time].\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>17. 电梯 / 楼梯搬运限制提醒\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 大件商品可能无法进电梯或通过楼梯、门洞\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Before delivery, please confirm the path for [Product Name].\n\nPackage size: [Package Size]\nDoor/elevator clearance needed: [Clearance]\nFloor/access notes: [Access Notes]\n\nIf the item cannot fit through the entrance, delivery may be delayed or returned. Send us your doorway and elevator measurements if you'd like us to check first.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>18. 安装孔位不匹配处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户组装时发现孔位偏差、螺丝难拧\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry assembly is not going smoothly.\n\nPlease send:\n• Photos of the hole alignment\n• The step number in the manual\n• The part labels involved\n\nSometimes lightly loosening nearby screws first can help align the frame. If parts are incorrect or defective, we'll send replacement parts right away.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>19. 板材气味 / 通风建议\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈新家具气味明显，担心环保安全\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>New furniture may have a light packaging or material smell after being sealed during shipping.\n\nPlease ventilate the room for [Days] days and wipe surfaces with a soft damp cloth if allowed by the care guide.\n\nCertifications: [Certification]. If the smell is strong, unusual, or does not fade, contact us with photos and batch information so we can escalate to quality review.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>20. 颜色木纹差异说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈木纹、色泽与图片不完全一致\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I understand the color or grain looks different from the photo.\n\nFor [Material], each piece may have natural grain variation, and screen lighting can also change how the finish appears. This is common for wood-style products.\n\nIf the difference is very large, please send photos in natural light and we'll compare them with our QC reference.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>21. 缺少说明书补发\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户没有收到安装说明书或扫码链接失效\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Sorry the manual was missing or hard to access.\n\nHere is the assembly guide for [Product Name]: [Manual Link]\nVideo guide: [Video Link]\n\nIf you tell us which step you're on, we can also guide you directly. We'll ask the warehouse to double-check manual packing for future orders.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>22. 桌椅晃动排查\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈桌子、椅子、柜体组装后不稳\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry [Product Name] feels unstable after assembly.\n\nPlease try:\n1) Place it on a flat surface\n2) Loosen all screws slightly\n3) Adjust the frame evenly\n4) Tighten screws diagonally\n\nIf it still wobbles, send a short video and we'll check whether replacement parts are needed.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>23. 墙面固定安全提醒\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 书柜、置物架等需要防倾倒固定\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>For safety, please use the included anti-tip kit with [Product Name], especially in homes with children or pets.\n\nWall types may require different anchors. If your wall is [Wall Type], please use [Anchor Type] or consult a local installer.\n\nIf any anti-tip hardware is missing, tell us your order number and we'll send it promptly.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>24. 退货拆装与包装要求\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户已组装后要求退货，需要说明包装与检查规则\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>We can help review your return request for [Product Name].\n\nReturn condition requirements:\n• Disassembled safely if possible\n• All parts and hardware included\n• Protected packaging for pickup\n• No major use damage\n\nPlease send photos of the current condition, and we'll confirm the next step and any pickup or inspection requirements.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>25. 部件编号确认\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要补发板件、螺丝、滑轨，需要确认编号\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>To send the correct replacement part, please check the manual and tell us the part number.\n\nNeeded info:\n• Order number: [Order Number]\n• Part number: [Part Number]\n• Quantity: [Quantity]\n• Photo of the damaged or missing part\n\nOnce confirmed, we'll arrange shipment and share tracking.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>26. 软装尺寸搭配建议\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问地毯、窗帘、抱枕等尺寸搭配\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'd be happy to help choose the right size for [Product Name].\n\nPlease share:\n• Room size: [Room Size]\n• Furniture size: [Furniture Size]\n• Style preference: [Style]\n\nFor most setups, we recommend [Recommended Size] so the space feels balanced and comfortable.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>27. 玻璃 / 陶瓷破损处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 易碎家居品运输破损，需要快速安抚与补发\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm very sorry [Product Name] arrived broken.\n\nFor safety, please avoid handling sharp pieces with bare hands. Send us:\n• Photos of the broken item\n• Photos of the outer packaging\n• Order number\n\nWe'll arrange [Replacement / Refund] as soon as possible and report the damage to the carrier.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>28. 尺寸买错挽回建议\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户买大/买小，想退货，需要推荐替代方案\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry [Product Name] didn't fit your space.\n\nIf you can share the actual space size, I can recommend a better option:\n• Smaller: [Alternative 1]\n• Larger: [Alternative 2]\n• Adjustable: [Alternative 3]\n\nIf you still prefer to return, I'll guide you through the return process based on the item's condition.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>29. 清洁剂误用补救\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户使用强清洁剂导致褪色、发白或表面损伤\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry the surface was affected after cleaning.\n\nPlease stop using the cleaner and send photos of the affected area. For [Material], we recommend [Recommended Cleaning Method] and avoiding [Avoid Items].\n\nWe'll check whether a touch-up kit, replacement part, or care advice can help improve the finish.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>30. 多包裹未全部送达说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/stron prefer, I can suggest our gentler alternatives with simpler formulas.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>22. 香味太浓 / 气味不适安抚\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈香味过重、不喜欢气味或怀疑变质\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry the scent of [Product Name] was not comfortable for you.\n\nFragrance perception can be very personal, but if the smell seems sour, rancid, or very different from normal, please send us the batch code and photos of the package.\n\nWe can help with [Resolution Option] according to your order status, and I can also recommend a fragrance-free option if you prefer.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>23. 开封后保质期说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问产品开封后多久用完、如何保存\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Great question! After opening [Product Name], we recommend using it within [Period] for best freshness and performance.\n\nStorage tips:\n• Keep the cap tightly closed\n• Store away from direct sunlight and heat\n• Use clean hands or tools when applying\n\nIf you notice changes in color, scent, or texture, please stop using it and contact us with the batch code.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>24. 起泥 / 搓泥使用指导\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈护肤品上脸后搓泥、与底妆不兼容\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Thanks for letting us know about pilling with [Product Name]. This can happen when products are layered too quickly or combined with certain silicone-rich formulas.\n\nPlease try:\n1) Use a smaller amount\n2) Wait [Minutes] minutes between layers\n3) Apply with gentle pressing instead of rubbing\n\nIf it still pills, tell me what products you use before and after it, and I'll help adjust the routine.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>25. 爆痘 / 闷痘反馈处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈使用后长痘，需区分适应期与不耐受\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry you're seeing breakouts after using [Product Name]. Please pause the product for [Days] days and keep your routine simple.\n\nBreakouts can be caused by many factors, but if bumps continue, become painful, or appear in areas where you normally do not break out, it may not suit your skin.\n\nSend us your skin type and how often you used it. We'll help with routine guidance and [Resolution Option] if needed.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>26. 套装使用顺序说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户购买护肤套装后不知道先后顺序\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Here is the recommended order for your [Set Name]:\n\n1) [Step 1 Product] - cleanse or prep\n2) [Step 2 Product] - treatment\n3) [Step 3 Product] - moisturize or seal\n4) Morning only: [SPF Product]\n\nStart slowly if you are new to actives. If irritation happens, reduce frequency and message us for a simpler plan.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>27. 色号二次推荐\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户第一次选色失败，需要重新推荐粉底、遮瑕或唇色\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'd be happy to help find a better shade for you.\n\nPlease send:\n• Your current shade: [Current Shade]\n• Whether it looks too light, dark, yellow, pink, or gray\n• A photo in natural light if convenient\n\nBased on that, I recommend trying [Recommended Shade]. We can also help with [Exchange Option] if your order is eligible.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>28. 美妆工具清洁建议\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问粉扑、刷具、美妆蛋如何清洁\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>To keep [Tool Name] clean and performing well, wash it every [Frequency] with mild soap or brush cleanser.\n\nSteps:\n1) Wet with lukewarm water\n2) Gently massage with cleanser\n3) Rinse until water runs clear\n4) Air dry fully before storing\n\nReplace it when you notice odor, tearing, or reduced performance.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>29. 批号 / 真伪查询说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要求核对批号、生产日期或真伪\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Thanks for checking. Please send a clear photo of the batch code on [Package Location].\n\nWe can verify:\n• Batch code: [Batch Code]\n• Production or best-before information\n• Whether the packaging matches our current version\n\nIf anything looks unusual, we'll escalate it to our quality team and help you with the next step.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>30. 皮肤屏障受损修护建议\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户皮肤泛红、干痒、屏障脆弱，询问产品搭配\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>If your skin barrier feels sensitive right now, I recommend keeping the routine very simple for [Days] days.\n\nUse:\n• Gentle cleanser: [Cleanser]\n• Barrier moisturizer: [Moisturizer]\n• Daytime SPF: [SPF]\n\nPause strong actives like [Active Ingredients] until your skin feels stable. If symptoms are severe or persistent, please seek professional medical advice.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>成分透明\u003c/strong>：成分信息要准确，避免隐瞒可能致敏成分\u003c/p>\n\u003cp>2. \u003cstrong>过敏优先\u003c/strong>：过敏问题要快速响应，优先保障客户安全\u003c/p>\n\u003cp>3. \u003cstrong>专业建议\u003c/strong>：根据肤质给出专业推荐，不要夸大产品效果\u003c/p>\n\u003cp>4. \u003cstrong>耐心引导\u003c/strong>：护肤效果需要时间，引导客户正确期望\u003c/p>\n\u003chr />\n\u00   <script>
    const pages = JSON.parse(document.getElementById("pages-data").textContent);
    let index = 0;

    const article = document.getElementById("article");
    const crumb = document.getElementById("crumb");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    async function copyText(text, btn) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        const old = btn.textContent;
        btn.textContent = "已复制";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = old;
          btn.classList.remove("copied");
        }, 1200);
      } catch (err) {
        console.error(err);
        btn.textContent = "复制失败";
      }
    }

    function render(i) {
      index = Math.max(0, Math.min(pages.length - 1, i));
      const page = pages[index];
      crumb.innerHTML = '<strong>' + page.groupLabel + '</strong> / ' + page.categoryLabel +
        ' <span style="opacity:.7">（' + (index + 1) + ' / ' + pages.length + '）</span>';
      article.innerHTML = '<div class="path-tag">' + page.path + '</div>' + page.html;
      prevBtn.disabled = index <= 0;
      nextBtn.disabled = index >= pages.length - 1;
      document.querySelectorAll(".nav-link").forEach((el) => {
        el.classList.toggle("active", Number(el.dataset.page) === index);
      });
      const active = document.querySelector(".nav-link.active");
      if (active && active.scrollIntoView) {
        active.scrollIntoView({ block: "nearest" });
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
      history.replaceState(null, "", "#p=" + encodeURIComponent(page.id));
    }

    document.getElementById("nav").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-page]");
      if (!btn) return;
      render(Number(btn.dataset.page));
    });

    article.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-copy]");
      if (!btn) return;
      const pre = btn.parentElement.querySelector("pre");
      if (pre) copyText(pre.textContent, btn);
    });

    prevBtn.addEventListener("click", () => render(index - 1));
    nextBtn.addEventListener("click", () => render(index + 1));

    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input, textarea")) return;
      if (e.key === "ArrowLeft") render(index - 1);
      if (e.key === "ArrowRight") render(index + 1);
    });

    const hash = location.hash.replace(/^#/, "");
    const params = new URLSearchParams(hash);
    const wanted = params.get("p");
    const start = wanted ? pages.findIndex((p) => p.id === wanted) : 0;
    render(start >= 0 ? start : 0);
  </script>
</body>
</html>
