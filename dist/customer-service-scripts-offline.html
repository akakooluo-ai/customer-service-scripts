    .sidebar {
      position: sticky;

    .pager { display: flex; gap: 8px; }

    .pager button:disabled { opacity: .4; cursor: not-allowed; }
    .article {

    .article blockquote {

      border-left: 3px solid var(--brand);
      background: var(--brand-soft);
      color: var(--muted);

    .script-block {
      position: relative;
      margin: 12px 0 18px;
    }
    .script-block pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: #1c1917;
      color: #f5f5f4;
      border-radius: 12px;
      padding: 16px 16px 18px;
      line-height: 1.65;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
    }
    .copy-btn {

      .toolbar { margin: -16px -16px 14px; padding: 12px 16px; }

    }

  <script type="application/json" id="pages-data">[{"id":"general/presales","path":"general/presales.md","title":"通用售前客服话术","group":"general","groupLabel":"通用话术","categoryLabel":"通用 · 售前","html":"\u003ch1>通用售前客服话术\u003c/h1>\n\u003cblockquote>适用于所有平台和行业的通用售前客服话术模板，涵盖产品咨询、价格说明、库存查询、优惠活动等场景。\u003c/blockquote>\n\u003ch2>使用说明\u003c/h2>\n\u003cul>\n\u003cli>话术中的 \u003ccode>[变量]\u003c/code> 需要根据实际情况替换\u003c/li>\n\u003cli>这些话术适用于任何电商平台和行业\u003c/li>\n\u003cli>建议根据具体平台和产品进行个性化调整\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2>1. 欢迎语\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户首次咨询时的开场白\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Welcome to our store! 👋 \nThank you for your interest in our products. \nHow can I help you today? \nFeel free to ask any questions about our products, shipping, or anything else. \nI'm here to help! 😊\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>2. 产品咨询\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问产品详情\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Thank you for your interest in [Product Name]! \nHere are the key features:\n• [Feature 1]\n• [Feature 2]\n• [Feature 3]\n\nSpecifications: [Specs]\nBest for: [Use cases]\n\nYou can find more details in the product description. \nAny specific questions? I'm happy to help! 📦\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>3. 价格说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问价格、能否优惠\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>The current price for [Product Name] is $[Price]. \nThis is our best price, reflecting the quality and value of the product.\n\nCurrent promotions:\n• [Promotion 1]\n• [Promotion 2]\n\nWe also offer [Repeat Customer Offer] for repeat customers. \nLet me know if you have any questions! 💰\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>4. 库存查询\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问库存情况\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Let me check the stock for you! 📦\n\n[Product Name] - [Variant]:\n• Current stock: [Quantity] units\n• Status: [Stock Status]\n\nThis is a popular item and sells quickly. \nIf you're interested, I recommend ordering soon to secure yours! \nNeed help with anything else? 🛒\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>5. 配送说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问配送方式、时效\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Shipping information for your location:\n\n📦 Shipping methods:\n• Standard: [Time] days - $[Price]\n• Express: [Time] days - $[Price]\n• Free shipping on orders over $[Amount]\n\nWe ship from [Location] and provide tracking for all orders.\nEstimated delivery: [Date Range]\n\nAny questions about shipping? 🚚\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>6. 优惠活动\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问当前优惠\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Great timing! We have some exciting offers right now! 🎉\n\nCurrent promotions:\n• [Promotion 1]: [Details]\n• [Promotion 2]: [Details]\n• [Promotion 3]: [Details]\n\nValid until: [End date]\n\nDon't miss out! Let me know if you need help applying any discounts. 💝\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>7. 产品对比\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问不同产品的区别\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Great question! Here's a comparison of [Product A] vs [Product B]:\n\n[Product A]:\n• Best for: [Use case]\n• Key feature: [Feature]\n• Price: $[Price]\n\n[Product B]:\n• Best for: [Use case]\n• Key feature: [Feature]\n• Price: $[Price]\n\nBased on your needs, I'd recommend [Recommendation]. \nWould you like more details on either? 🤔\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>8. 购买保障\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户对购买安全有疑虑\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Your purchase is fully protected! 🛡️\n\nWe offer:\n✓ [Return Policy]\n✓ [Warranty]\n✓ [Secure payment]\n✓ [Customer support]\n\nOur store has [X]% positive reviews and [X] satisfied customers.\nYou can shop with confidence! \nAny other concerns? 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>9. 产品推荐\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 向客户推荐相关产品\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Based on your interest in [Product A], you might also like:\n\n1. [Product B] - [Brief description]\n2. [Product C] - [Brief description]\n3. [Product D] - [Brief description]\n\nMany customers who bought [Product A] also purchased these!\nWould you like more details on any of them? 🛍️\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>10. 结束语\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 咨询结束时的收尾\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Thank you for chatting with us! 😊\n\nQuick summary:\n• [Key point 1]\n• [Key point 2]\n\nIf you have any more questions, feel free to reach out anytime.\nWe're here to help!\n\nHave a great day and happy shopping! 🎉\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>11. 限时优惠提醒\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户已表现出兴趣，但迟迟未下单，需要温和催单\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Just a quick heads-up: the current offer on [Product Name] ends on [Offer End Time]. ⏰\n\nRight now you can get:\n• Price: $[Price]\n• Discount: [Discount Offer]\n• Extra benefit: [Extra Benefit]\n\nIf you've been considering it, this is the best time to place the order before the promotion ends.\n\nIf you'd like, I can also help confirm the right [Preferred Variant] before you check out.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>12. 优惠券失效挽回\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反馈优惠券不能用、错过了活动，需尽量挽回订单\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry that coupon didn't work as expected. Let me help with that. 🎫\n\nHere are the options I can offer for [Product Name]:\n• Replacement code: [Code]\n• Discount value: [Discount Value]\n• Valid until: [Coupon Expiry Time]\n\nIf the system still doesn't accept it, send me a screenshot and I'll check whether it's due to:\n• Minimum order value\n• Product exclusions\n• Account/location restrictions\n\nI don't want you to miss the deal if you're ready to order today.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>13. 凑单达免邮/满减引导\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户购物车金额接近免邮或满减门槛\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>You're very close to unlocking a better deal on your order. 🛒\n\nCurrent cart total: $[Current Amount]\nOffer threshold: $[Target Amount]\nYou only need: $[Gap Amount] more to get [Threshold Reward].\n\nPopular add-on options:\n• [Add-on Product 1] - $[Price]\n• [Add-on Product 2] - $[Price]\n• [Add-on Product 3] - $[Price]\n\nIf you'd like, I can recommend the most practical add-on based on what you're already buying.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>14. 首单优惠转化\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 新客第一次咨询，想降低试单门槛\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Welcome! Since this would be your first order with us, I'd love to make it easier for you to try us out. 🎉\n\nFor first-time customers, we currently offer:\n• [First order discount]\n• [First Order Bonus]\n• [Shopping Assurance]\n\nUse code: [Code]\nValid until: [Date]\n\nIf you want, I can also help you choose the best starter option so your first purchase feels low-risk and worthwhile.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>15. 低库存成交促进\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 热门 SKU 库存紧张，需提醒客户及时下单\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I want to be transparent: [Product Name] in [Variant] is running low in stock. 📦\n\nCurrent availability:\n• Remaining units: [Quantity]\n• Restock date: [Restock Date]\n\nBecause this option has been selling quickly, there's a chance it may sell out before the next restock.\n\nIf this is the version you want, I'd recommend ordering soon. If you'd like, I can also suggest the closest alternative in case it goes out of stock.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>16. 即将涨价提醒\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户反复观望，价格即将调整\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Just so you can make the best decision: the price for [Product Name] is scheduled to change on [Date]. 💡\n\nCurrent price: $[Current Price]\nNew price after adjustment: $[New Price]\nReason: [Price Change Reason]\n\nIf you place the order before [Price Lock Deadline], you'll still lock in the current lower price.\n\nIf you need help deciding between options before then, I'm happy to help.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>17. 比价收口成交\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户拿竞品或其他店铺比价，需要突出本店价值并促成下单\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>That's a fair question. Price matters, and so does what you actually receive. 🤝\n\nWith our [Product Name], you're getting:\n• [Key quality point]\n• [After-sales Support]\n• [Delivery Advantage]\n• [Extra Value]\n\nSo while another listing may look cheaper at first glance, our offer is designed to give you better overall value and less risk after purchase.\n\nIf you'd like, I can help you compare the exact differences so you can buy with confidence.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>18. 犹豫客户安心下单\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户想买但担心踩坑，需要降低决策焦虑\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>It's completely normal to want to be sure before placing an order. 😊\n\nTo make your decision easier, here are the protections we provide:\n• [Return window]\n• [Quality Guarantee]\n• [Shipping tracking]\n• [Support promise]\n\nIf the item isn't the right fit, we'll help with [Resolution Option] according to our policy.\n\nIf you tell me what you're most concerned about, I'll answer that part directly so you can decide with confidence.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>19. 购物车挽回跟进\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户已加购或聊到临门一脚，但未完成支付\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I noticed you were interested in [Product Name], so I wanted to check in before you miss the current offer. 🛍️\n\nYour potential order includes:\n• Product: [Product Name]\n• Price: $[Price]\n• Offer: [Promotion]\n\nIf something is stopping you from checking out, tell me what it is:\n• Need a better size/color recommendation?\n• Unsure about delivery time?\n• Trouble applying the discount?\n\nIf you reply here, I'll help you get it sorted quickly.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>20. 套装/加购提升客单\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户准备下单，适合推荐套装或关联加购提升成交额\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Great choice on [Main Product]! Many customers also add one of these to get better overall value: ✨\n\nRecommended add-ons:\n• [Product A] - solves [Need]\n• [Product B] - works well for [Use case]\n• [Product C] - helps with [Benefit]\n\nBundle benefit:\n• Save [Bundle Savings]\n• Get [Bundle Bonus]\n\nIf you want the most cost-effective setup, I can suggest the best combination based on your budget.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>快速响应\u003c/strong>：尽量在 5 分钟内回复客户咨询\u003c/p>\n\u003cp>2. \u003cstrong>专业友好\u003c/strong>：保持礼貌和专业，避免生硬的模板感\u003c/p>\n\u003cp>3. \u003cstrong>信息准确\u003c/strong>：确保产品信息、价格、库存等信息准确\u003c/p>\n\u003cp>4. \u003cstrong>主动推荐\u003c/strong>：根据客户需求主动推荐相关产品\u003c/p>\n\u003cp>5. \u003cstrong>推动成交\u003c/strong>：提醒优惠时要给出明确截止时间，但避免制造虚假紧迫感\u003c/p>\n\u003cp>6. \u003cstrong>降低风险\u003c/strong>：高转化话术要同时回答价格、时效、售后保障这三类顾虑\u003c/p>\n\u003chr />\n\u003cp>\u003cstrong>更多快语AI话术模板：\u003c/strong> [https://www.talkq.vip/templates/](https://www.talkq.vip/templates/)\u003c/p>"},{"id":"general/sales","path":"general/sales.md","title":"通用售中客服话术","group":"general","groupLabel":"通用话术","categoryLabel":"通用 · 售中","html":"\u003ch1>通用售中客服话术\u003c/h1>\n\u003cblockquote>适用于所有平台和行业的通用售中客服话术模板，涵盖订单确认、物流跟踪、支付处理、订单修改等场景。\u003c/blockquote>\n\u003ch2>使用说明\u003c/h2>\n\u003cul>\n\u003cli>话术中的 \u003ccode>[变量]\u003c/code> 需要根据实际情况替换\u003c/li>\n\u003cli>这些话术适用于任何电商平台和行业\u003c/li>\n\u003cli>建议根据具体平台和产品进行个性化调整\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2>1. 订单确认\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户下单后确认订单信息\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Thank you for your order! 🎉\n\nOrder details:\n• Order #: [Order Number]\n• Product: [Product Name]\n• Quantity: [Quantity]\n• Total: $[Amount]\n\nShipping to: [Address]\nEstimated delivery: [Date]\n\nPlease verify this information is correct. \nIf you need to make any changes, let us know ASAP!\nWe'll notify you when your order ships. 📦\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>2. 发货通知\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订单发货后通知客户\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Great news! Your order has shipped! 🚚\n\nTracking information:\n• Carrier: [Carrier Name]\n• Tracking #: [Tracking Number]\n• Estimated delivery: [Date]\n\nTrack your package: [Tracking Link]\n\nTips:\n• Save this tracking number\n• Check tracking for updates\n• Contact us if no movement after [Days] days\n\nEnjoy your purchase! 📦\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>3. 物流追踪\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问物流进度\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Let me check your order status! 📦\n\nOrder #: [Order Number]\nTracking #: [Tracking Number]\nCurrent status: [Status]\nLocation: [Current Location]\nEstimated delivery: [Date]\n\nTrack here: [Tracking Link]\n\nIf tracking hasn't updated in [Days] days, please let us know and we'll investigate with the carrier. 🚚\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>4. 物流延迟处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 物流出现延迟\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I apologize for the shipping delay! 😔\n\nI've checked your order:\n• Order #: [Order Number]\n• Current status: [Status]\n• Reason for delay: [Delay Reason]\n\nWe're monitoring this closely. \nNew estimated delivery: [Date]\n\nIf it doesn't arrive by [Date], please contact us and we'll:\n• File a claim with the carrier\n• Send a replacement or issue a refund\n\nWe appreciate your patience! 🙏\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>5. 支付问题处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户支付失败或有支付疑问\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I see there might be a payment issue! 💳\n\nPlease check:\n• Card information is correct\n• Billing address matches your card\n• Sufficient funds available\n• Card is not expired\n\nIf the issue persists:\n• Try a different payment method\n• Contact your bank\n• Clear browser cache and try again\n\nNeed help? I can guide you through the process! 🛒\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>6. 订单修改\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要求修改订单\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I understand you'd like to modify your order! 📝\n\nOrder #: [Order Number]\nCurrent status: [Status]\n\nIf your order hasn't shipped yet:\n✓ We can change: [Editable Fields]\n✓ Please confirm the changes you need\n\nIf your order has already shipped:\n• Address change: We'll try to intercept with the carrier\n• Item change: Please return and reorder, or wait for delivery and exchange\n\nWhat changes do you need? 🔄\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>7. 订单取消\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要求取消订单\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I can help you cancel your order! 🛑\n\nOrder #: [Order Number]\nStatus: [Status]\n\nIf not yet shipped:\n✓ Cancellation confirmed\n✓ Refund processed within [Days] business days\n\nIf already shipped:\n• We can try to intercept the package\n• Or you can refuse delivery / return when received\n• Refund after we receive the item back\n\nShall I proceed with the cancellation? 📦\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>8. 地址确认/修改\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 确认或修改收货地址\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Let me verify your shipping address! 📍\n\nCurrent address on file:\n[Full Address]\n\nIs this correct? \n\nIf you need to change it:\n• Before shipping: We can update immediately\n• After shipping: We'll contact the carrier (may incur fees)\n\nPlease confirm or provide the correct address! 🏠\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>9. 预计送达时间\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问预计送达时间\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Delivery estimate for your order: 📅\n\nOrder #: [Order Number]\nShipping method: [Method]\nShip from: [Location]\nShip to: [Destination]\n\nEstimated delivery: [Date Range]\n\nNote: This is an estimate and may vary due to:\n• Carrier performance\n• Weather conditions\n• Customs processing (international)\n\nWe'll send tracking info once shipped! 🚚\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>10. 订单状态查询\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问订单当前状态\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Here's your order status! 📋\n\nOrder #: [Order Number]\nStatus: [Current Status]\n\nTimeline:\n✓ Order placed: [Date]\n✓ Payment confirmed: [Date]\n[Processing Status] Processing: [Processing Update]\n[Shipping Status] Shipped: [Shipping Update]\n[Delivery Status] Delivered: [Delivery Update]\n\nNext step: [What happens next]\n\nQuestions? I'm here to help! 📦\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>11. 加购配件推荐\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户已下单或准备下单，适合推荐配件、耗材或保护套\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Thanks for choosing [Product Name]!\n\nBefore we ship, you may also want to add:\n• [Accessory 1] - best for [Use Case 1]\n• [Accessory 2] - best for [Use Case 2]\n• [Consumable] - useful if you plan to use it often\n\nIf you add it before [Cutoff Time], we can try to ship everything together and reduce extra shipping cost.\n\nWould you like me to send the add-on link?\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>12. 套餐推荐\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户犹豫单品还是套装，需要解释套餐价值\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>If you're comparing the single item and the bundle, here's the difference:\n\nSingle item: [Single Product]\nBundle: [Bundle Name]\nIncludes: [Bundle Items]\nSavings: $[Savings Amount]\n\nThe bundle is better if you need [Use case], because it includes the accessories most customers buy later.\n\nIf you only need the basic function, the single item is enough.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>13. 优惠券未使用挽回\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户下单后发现忘记使用优惠券或折扣码\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I understand you missed the coupon on order [Order Number].\n\nCoupon code: [Coupon Code]\nExpected discount: $[Discount Amount]\n\nIf the order has not shipped, we can try one of these options:\n1) Cancel and reorder with the coupon\n2) Offer store credit/voucher for your next purchase\n3) Apply a partial adjustment if the platform allows it\n\nWhich option would you prefer?\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>14. 补货时间说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问缺货商品何时恢复库存\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>[Product Name] is currently out of stock.\n\nExpected restock: [Restock Date]\nAvailable variant now: [Available Variant]\nSimilar option: [Alternative Product]\n\nIf you can wait, I recommend joining the restock reminder so you get notified first. If you need it sooner, [Alternative Product] is the closest match in function and price.\n\nWould you like the restock link or the alternative link?\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>15. 预售订单安抚\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户已下预售订单，担心发货时间或库存保障\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Your preorder is confirmed.\n\nOrder number: [Order Number]\nProduct: [Product Name]\nEstimated ship date: [Ship Date]\nEstimated delivery: [Delivery Date]\n\nPreorders are shipped in payment order after stock arrives. If the schedule changes, we will notify you before [Notice Date].\n\nYou can keep the preorder for priority stock, or request cancellation before shipping if your plan changes.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>16. 待支付提醒\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户创建订单但未完成付款\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hi! Your order is still waiting for payment.\n\nOrder number: [Order Number]\nProduct: [Product Name]\nAmount: $[Amount]\nPayment deadline: [Payment Deadline]\n\nStock is reserved only after payment is completed. If you had trouble paying, you can try another payment method or send us the error screenshot and we'll help.\n\nNeed the checkout link again?\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>17. 地址风险确认\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 系统或客服发现地址不完整、邮编异常、电话缺失\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Before shipping order [Order Number], we need to confirm your delivery address.\n\nCurrent address:\n[Full Address]\n\nPossible issue: [Address Issue]\n\nPlease reply with the corrected address, including:\n• Recipient name\n• Street address\n• City / State / Postal code\n• Phone number\n\nWe will hold the shipment until [Hold Deadline] to avoid failed delivery.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>18. 礼品留言确认\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户下单作为礼物，需要确认包装、留言或发票\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Thanks for ordering [Product Name] as a gift.\n\nPlease confirm:\n• Gift message: [Gift Message]\n• Gift packaging: [Yes Or No]\n• Hide invoice price: [Yes Or No]\n• Delivery date needed: [Date]\n\nWe'll prepare the order according to your preferences where available. If gift packaging is not supported for this item, we'll still make sure the package is clean and suitable for gifting.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>19. 订阅续费提醒\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订阅、耗材、会员类订单即将续费或发货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Your subscription order is coming up.\n\nSubscription: [Subscription Name]\nNext charge date: [Charge Date]\nNext shipment date: [Ship Date]\nAmount: $[Amount]\n\nIf everything looks good, no action is needed. If you want to skip, pause, change quantity, or update address, please do so before [Change Deadline].\n\nI'm happy to help adjust it for you.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>20. 配送升级建议\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户需要赶时间，适合推荐加急配送或拆单发货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>If you need the order faster, we can check delivery upgrade options.\n\nCurrent shipping: [Current Method]\nEstimated delivery: [Current ETA]\n\nUpgrade option:\n• Method: [Upgrade Method]\n• Extra cost: $[Extra Cost]\n• Estimated delivery: [Upgrade ETA]\n\nIf you approve before [Cutoff Time], we can update the shipping method before dispatch. Otherwise, the order will ship with the current method.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>主动通知\u003c/strong>：订单确认和发货通知要主动发送\u003c/p>\n\u003cp>2. \u003cstrong>信息准确\u003c/strong>：确保订单号、追踪号等信息准确无误\u003c/p>\n\u003cp>3. \u003cstrong>及时响应\u003c/strong>：售中问题要在 2 小时内响应\u003c/p>\n\u003cp>4. \u003cstrong>避免模糊\u003c/strong>：给出具体时间，不要使用&quot;尽快&quot;等模糊表述\u003c/p>\n\u003chr />\n\u003cp>\u003cstrong>更多快语AI话术模板：\u003c/strong> [https://www.talkq.vip/templates/](https://www.talkq.vip/templates/)\u003c/p>"},{"id":"general/aftersales","path":"general/aftersales.md","title":"通用售后客服话术","group":"general","groupLabel":"通用话术","categoryLabel":"通用 · 售后","html":"\u003ch1>通用售后客服话术\u003c/h1>\n\u003cblockquote>适用于所有平台和行业的通用售后客服话术模板，涵盖退换货、质量问题、投诉处理、评价引导等场景。\u003c/blockquote>\n\u003ch2>使用说明\u003c/h2>\n\u003cul>\n\u003cli>话术中的 \u003ccode>[变量]\u003c/code> 需要根据实际情况替换\u003c/li>\n\u003cli>这些话术适用于任何电商平台和行业\u003c/li>\n\u003cli>建议根据具体平台和产品进行个性化调整\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2>1. 退货政策说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问退货政策\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Our return policy: 📦\n\n• Return window: [Days] days from delivery\n• Condition: Unused, original packaging, tags attached\n• Refund method: Original payment method\n• Processing time: [Days] business days after we receive the item\n\nExceptions:\n• [Return Exception 1]\n• [Return Exception 2]\n\nNeed to start a return? Let me help! 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>2. 退货申请处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要求退货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry to hear you'd like to return your order! 😔\n\nTo process your return:\n1) Please confirm your order number: [Order Number]\n2) Reason for return: [Reason]\n3) Item condition: [Item Condition]\n\nNext steps:\n• We'll send you a return shipping label\n• Pack the item securely\n• Drop off at [Carrier location]\n• Refund processed within [Days] days of receipt\n\nAny questions about the process? 📦\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>3. 换货处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要求换货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Happy to help with an exchange! 🔄\n\nYour current order: [Product details]\nExchange for: [Requested Replacement Item]\n\nProcess:\n1) We'll ship the new item first\n2) Return the original within [Days] days\n3) Free return shipping label provided\n\nStock check: [Replacement Item] is [Replacement Stock Status]\nShall I proceed with the exchange? 📦\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>4. 质量问题处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户收到有质量问题的商品\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm very sorry about the quality issue! 😔\n\nPlease send us:\n1) Photos of the defect\n2) Photo of the product label/tag\n3) Brief description of the problem\n\nWe'll offer:\n✓ Full replacement (no return needed)\n✓ OR Full refund (keep the item)\n✓ PLUS [Compensation Offer] for your next order\n\nWe sincerely apologize for the inconvenience! 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>5. 商品不符处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户收到的商品与描述不符\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I apologize that the item doesn't match the description! 😔\n\nPlease provide:\n• Photo of what you received\n• What was different from the listing\n\nWe'll immediately:\n✓ Send the correct item\n✓ OR Process a full refund\n✓ Return shipping on us\n\nThis shouldn't have happened. We're sorry! 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>6. 物流问题处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 包裹丢失、延迟、损坏\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm sorry about the shipping issue! 📦\n\nLet me check your tracking: [Tracking Number]\nStatus: [Current Status]\n\nIf the package is:\n• Delayed: We'll contact the carrier and update you\n• Lost: We'll file a claim and send a replacement or refund\n• Damaged: Please send photos, we'll replace immediately\n\nWe'll resolve this for you! 🚚\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>7. 投诉处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户投诉、表达不满\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>I'm truly sorry for your experience! 😔\n\nI understand your frustration, and I want to make this right.\n\nPlease share:\n• What happened\n• How we can improve\n• What resolution you'd prefer\n\nWe take all feedback seriously and will:\n1) Investigate the issue\n2) Provide a solution within [Time]\n3) Ensure this doesn't happen again\n\nYour satisfaction is our priority! 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>8. 差评回应\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户留下差评后的跟进\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Thank you for your feedback! 🙏\n\nI'm sorry we didn't meet your expectations. \nWe've reviewed your order and would like to make things right.\n\nWe can offer:\n• [Solution 1]\n• [Solution 2]\n• [Solution 3]\n\nPlease contact us directly so we can resolve this for you.\nWe value your business and hope to earn back your trust! 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>9. 评价引导\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 售后满意后引导客户留评\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Thank you for your purchase! 🎉\n\nWe hope you're enjoying your [Product Name]!\n\nIf you're satisfied with your order, we'd really appreciate a review. \nYour feedback helps other customers and supports our small business.\n\nIf there's anything that could be better, please let us know first - \nwe want to make sure you're 100% happy!\n\nThank you for your support! ⭐\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>10. 满意度回访\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 售后问题解决后的回访\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hi! Just following up on your recent order. 😊\n\nI wanted to make sure:\n✓ You received your [Resolution Outcome]\n✓ Everything is working well\n✓ You're satisfied with the resolution\n\nIs there anything else I can help with?\n\nThank you for your patience and understanding!\nWe appreciate your business! 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>11. 物流严重延误（双语）\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户投诉物流太慢，需中英同步安抚\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello — we're very sorry your order #[Order Number] is taking longer than expected.\n\nCurrent tracking: [Carrier] [Tracking] — last update: [Date]. New ETA: [Date]. We know waiting is frustrating; we're monitoring daily.\n\nIf it doesn't move by [Date], we'll [Resolution Plan] per our policy.\n\n您好，非常抱歉，您的订单 #[Order Number] 物流比预期更慢。\n\n当前物流：[Carrier] [Tracking]，上次更新：[Date]，目前预计送达：[Date]。我们理解等待很煎熬，会每日跟进。\n\n若 [Date] 前仍无有效更新，我们将按政策为您 [处理方案]。\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>12. 错发商品（双语）\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户收到错误 SKU，需道歉与换货/退款指引\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello — we apologize: you received the wrong item for order #[Order Number].\n\nPlease send a photo of what arrived + the packing slip. We'll send the correct item immediately and provide a prepaid return label (or let you keep the wrong item if it's low value).\n\nIf you prefer a refund instead, we'll process it within [Timeframe].\n\n您好，非常抱歉，订单 #[Order pre>Hello! I can help modify order #[Order Number].\n\nCurrent Status: [Status]\n\n[If not shipped]\nI can change:\n✓ Shipping address\n✓ Product color/size\n✓ Shipping method\n\nPlease confirm what you'd like to change, and I'll update immediately.\n\n[If already shipped]\nSorry, the order has shipped and cannot be modified. Options:\n• Refuse delivery → Full refund\n• Return after receiving → Full refund\n• Keep item → I can offer [Discount] on next order\n\nHow would you like to proceed?\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>8. 订单取消处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家要求取消订单\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand you want to cancel order #[Order Number].\n\n[If not shipped]\nNo problem! I've cancelled your order. Refund details:\n• Amount: $[Amount]\n• Method: Original payment\n• Timeline: 3-7 business days\n\n[If already shipped]\nThe order has shipped. Options:\n• Option A: Refuse delivery when it arrives (free)\n• Option B: Return after receiving for full refund\n\nI'm sorry to see you cancel. May I ask the reason? We'd love to improve!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>9. 买家保护延期\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 物流延误需要延长保护期\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I noticed your order #[Order Number] is taking longer than expected.\n\nTo protect your purchase, I've extended your Buyer Protection by [X] days.\n\nNew Protection Deadline: [Date]\n\nThis means:\n• You're still fully protected\n• Can open dispute if needed\n• No rush to confirm receipt\n\nYour package is still on the way. Current status: [Status]\n\nIf it doesn't arrive by [Date], please contact me for a full refund. Thank you for your patience!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>10. 催单处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c
