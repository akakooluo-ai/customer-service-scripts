ons: Item unused, original packaging\n\nReturn Options:\n• Full refund: Return item to us\n• Partial refund: Keep item + get [X]% back\n• Free return: For defective/wrong items\n\nHow to Return:\n1. Open dispute on AliExpress\n2. Select &quot;Return goods&quot;\n3. Ship with tracking number\n4. Refund after we receive\n\nNote: International return shipping is buyer's responsibility (unless our fault).\n\nWhich option works for you?\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>2. 退款处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 通知买家退款进度\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Your refund for order #[Order Number] has been processed.\n\nRefund Details:\n• Amount: $[Amount]\n• Method: Original payment\n• Processing date: [Date]\n\nTimeline:\n• Credit card: 7-14 business days\n• PayPal: 3-5 business days\n• AliPay: 1-3 business days\n\nThe refund will appear on your statement. If you don't see it after this timeframe, please contact your bank.\n\nThank you for your patience!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>3. Item Not Received 纠纷\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家开启未收到货纠纷\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm sorry your order #[Order Number] hasn't arrived.\n\nTracking Status: [Status]\nLast Location: [Location]\nExpected Delivery: [Original Date]\n\nInvestigation:\n• I've contacted the carrier\n• Filed a lost package claim\n• Extended your buyer protection\n\nSolution Options:\n1. Wait [X] more days (package may still arrive)\n2. Full refund now (no need to wait)\n3. Resend new package (free express shipping)\n\nWhich option do you prefer? I want to resolve this for you!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>4. Item Not as Described 纠纷\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家开启货不对板纠纷\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm very sorry the item doesn't match your expectations.\n\nOrder #[Order Number]\nIssue: [Description of problem]\n\nPlease send photos/videos showing:\n1. The problem with the item\n2. Product label/tag\n3. Package condition\n\nSolution Options:\n1. Full refund (return item)\n2. Partial refund [X]% (keep item)\n3. Free replacement (we pay shipping)\n\nI'll process your preferred solution within 24 hours. Again, I sincerely apologize!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>5. 质量问题处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家反馈商品有质量问题\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm very sorry about the quality issue with order #[Order Number].\n\nThis is not acceptable and I apologize sincerely.\n\nPlease share:\n• Photos of the defect\n• Video if possible (for functional issues)\n\nImmediate Solutions:\n✓ Full refund - No return needed\n✓ Replacement - Free express shipping\n✓ Partial refund - Keep item + [X]% back\n\nPlus: $[Amount] coupon for your next order as apology\n\nWhich solution works best for you? I'll process it right away!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>6. 差评挽回\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家留下差评后主动联系\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I noticed your feedback on order #[Order Number] and I'm truly sorry about your experience.\n\nI want to make this right. Here's what I can offer:\n• Full refund (you can keep the item)\n• Free replacement with express shipping\n• $[Amount] store credit for future purchase\n\nI've already [Action Taken To Resolve].\n\nIf you're satisfied with the resolution, would you consider updating your feedback? Your satisfaction is my top priority.\n\nPlease let me know how I can help further!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>7. 评价引导\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订单完成后引导好评\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for your purchase of [Product Name]!\n\nWe hope you're enjoying your item. Your feedback means a lot to us and helps other buyers make decisions.\n\nIf you're satisfied, we'd appreciate a 5-star review! ⭐⭐⭐⭐⭐\n\nAs a thank you:\n🎁 Leave a review with photo → Get $[Amount] coupon\n🎁 5-star review → Extra [X]% off next order\n\nHow to leave review:\nOrder page → &quot;Leave Feedback&quot; → Rate &amp; comment\n\nIf anything is not perfect, please contact me first - I'll fix it immediately!\n\nThank you for your support!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>8. 部分退款协商\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 协商部分退款解决问题\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand your concern about order #[Order Number].\n\nSince international return shipping is expensive, I'd like to offer:\n\nOption 1: [X]% partial refund ($[Amount]) - Keep the item\nOption 2: [Y]% partial refund ($[Amount]) + $[Amount] coupon\nOption 3: Full refund with return (you pay return shipping)\n\nMy Recommendation:\nOption [X] gives you the best value - you keep the item and get money back.\n\nWhich option works for you? I want to find a fair solution!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>9. 换货处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家申请换货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'd be happy to help with an exchange for order #[Order Number].\n\nExchange Details:\n• Current item: [Item received]\n• Requested: [Item wanted]\n\nProcess:\n1. I'll send the correct item now (free shipping)\n2. You can keep or return the wrong item (your choice)\n3. If returning: I'll provide shipping label/compensation\n\nNew Item Shipping:\n• Method: [Express shipping]\n• Tracking: Will send within 24 hours\n• Estimated delivery: [X-X] days\n\nSound good? I'll process immediately!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>10. 纠纷升级处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 纠纷升级到平台介入\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I see the dispute for order #[Order Number] has been escalated.\n\nI want to resolve this fairly. Here's my proposal:\n\nEvidence Provided:\n• Shipping proof: [Tracking showing delivered/in transit]\n• Product photos: [Quality check before shipping]\n• Communication records: [Our previous messages]\n\nMy Offer:\n[Resolution Option] - whichever you prefer\n\nI believe this is a fair resolution. If you agree, please accept the proposal in the dispute.\n\nIf you have other concerns, please let me know. I'm committed to finding a solution that works for both of us.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>11. 物流延误安抚\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 跨境物流超时，但包裹仍有轨迹、买家准备开纠纷\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I checked order #[Order Number] and the package is still moving.\n\nTracking: [Tracking Number]\nCarrier: [Carrier]\nLatest status: [Status]\nLast location: [Location]\nNew estimated delivery: [New ETA]\n\nInternational transit can take longer at customs or the last-mile depot. I have also extended buyer protection until [Protection End Date].\n\nIf there is no new scan by [Follow-up Date], we can offer:\n1) Keep waiting with protection extended\n2) Full refund now\n3) Resend if stock is available\n\nWhich option do you prefer?\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>12. 纠纷举证引导\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家已开纠纷，需要双方补充照片、物流和沟通记录\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! To resolve the dispute for order #[Order Number] faster, please upload these items in the AliExpress dispute:\n\n1) Photos or video of the issue\n2) Photo of the product label or SKU\n3) Photo of the outer package and shipping label\n4) Your preferred solution\n\nI will also upload:\n• Shipping proof and tracking\n• Pre-shipment quality photos\n• Our previous message records\n\nOnce both sides submit evidence, I can offer a fair proposal within [Time]. Please keep the dispute open so we can settle it inside AliExpress.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>13. 国际退货部分退款\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 退货运费高于商品价值，协商买家留货并接受部分退款\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand you want a refund for order #[Order Number].\n\nBecause international return shipping can cost more than the item, I recommend a keep-the-item solution:\n\n• Partial refund: $[Amount] ([X]%)\n• Plus coupon: $[Coupon Amount] for your next order\n• No return shipping needed\n\nAlternative: full refund after you return the item. Return shipping is usually the buyer's responsibility unless the item is defective or wrong.\n\nIf this works, please accept the proposal in the dispute and I will process it right away.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>14. 保护期延长说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家担心 AliExpress 买家保护即将到期\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Buyer protection for order #[Order Number] is still active.\n\nCurrent protection end date: [Protection End Date]\nTracking status: [Status]\n\nI have requested an extension so you stay covered while we wait for delivery or review your case. You do not need to open a dispute yet unless you prefer to start one now.\n\nIf the package still has not arrived by [Follow-up Date], message me and I will help with refund or replacement under AliExpress Buyer Protection.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>15. 平台介入降级\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 纠纷已升级平台介入，卖家提出可接受方案避免恶化\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I see AliExpress has been asked to step in on order #[Order Number].\n\nI still want to settle this with you directly. My updated offer:\n• Resolution: [Resolution Option]\n• Amount: $[Amount]\n• Extra apology coupon: $[Coupon Amount]\n\nPlease review the proposal in the dispute. If you accept, AliExpress can close the case faster and you will not need to wait for a platform decision.\n\nIf you need a different option, tell me what would feel fair and I will adjust the proposal.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>快速响应\u003c/strong>：24 小时内响应纠纷，避免自动判买家胜诉\u003c/p>\n\u003cp>2. \u003cstrong>提供证据\u003c/strong>：上传发货凭证、物流追踪、产品照片\u003c/p>\n\u003cp>3. \u003cstrong>灵活方案\u003c/strong>：国际退货成本高，优先提供部分退款\u003c/p>\n\u003cp>4. \u003cstrong>主动补偿\u003c/strong>：提供优惠券或折扣，化危机为复购机会\u003c/p>\n\u003cp>5. \u003cstrong>避免违规\u003c/strong>：不要好评返现，所有引导必须符合平台规则\u003c/p>\n\u003chr />\n\u003ch2>注意事项\u003c/h2>\n\u003cul>\n\u003cli>❌ 禁止好评返现（&quot;5-star review = $5 back&quot;）\u003c/li>\n\u003cli>❌ 禁止威胁买家修改评价\u003c/li>\n\u003cli>❌ 禁止引导站外交易\u003c/li>\n\u003cli>✅ 可以提供优惠券感谢评价\u003c/li>\n\u003cli>✅ 可以请求买家更新评价（解决问题后）\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003cp>\u003cstrong>更多快语AI话术模板：\u003c/strong> [https://www.talkq.vip/templates/](https://www.talkq.vip/templates/)\u003c/p>"},{"id":"platforms/amazon/presales","path":"platforms/amazon/presales.md","title":"Amazon 售前客服话术","group":"platforms","groupLabel":"平台话术","categoryLabel":"Amazon · 售前","html":"\u003ch1>Amazon 售前客服话术\u003c/h1>\n\u003cblockquote>专业的 Amazon 售前客服话术模板，涵盖 Prime 配送、FBA 物流、A-to-Z 保障、产品咨询等场景。\u003c/blockquote>\n\u003ch2>使用说明\u003c/h2>\n\u003cul>\n\u003cli>话术中的 \u003ccode>[变量]\u003c/code> 需要根据实际情况替换\u003c/li>\n\u003cli>建议配合快捷回复软件使用，提升响应速度\u003c/li>\n\u003cli>Amazon 要求 24 小时内回复客户咨询\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2>1. Prime 配送说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问配送时效、是否支持 Prime\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! This item is eligible for Amazon Prime fast shipping. If you are a Prime member, you can enjoy free two-day (or faster, where available) delivery on this order. At checkout, please make sure your address supports Prime service, and Amazon will handle the delivery directly and keep you updated with tracking information.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>2. A-to-Z 保障说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户对购买安全有疑虑\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! This purchase is protected by Amazon's A-to-z Guarantee, which helps you if there are issues with delivery or the condition of your item. If anything goes wrong after you place the order, you can contact us through Amazon messages or open an A-to-z claim, and Amazon will help review the case and protect your rights as a buyer.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>3. FBA 物流说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问发货方式、物流速度\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! This item is fulfilled by Amazon (FBA), which means it is stored, packed, and shipped by Amazon from their own warehouses. Orders are processed quickly, and you can track the parcel directly in your Amazon account. If there are any shipping-related issues, Amazon's customer service team can step in to assist you.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>4. Prime 会员优惠\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问会员专属优惠\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! As an Amazon Prime member, you can enjoy free fast shipping on this item and sometimes additional member-only discounts. When you are logged in with your Prime account, any available promotions or coupons will be shown automatically on the product page and at checkout. If you have questions about a specific offer, feel free to let us know.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>5. 产品推荐\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 向客户推荐相关产品\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Based on your interest in [Product A], I think you might also like [Product B]. It has similar features but offers [Unique Benefit]. Many customers who bought [Product A] also purchased [Product B] and were very satisfied. Would you like to learn more about it?\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>6. 库存紧张提醒\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 热销商品库存不足时\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for your interest in this item. I wanted to let you know that we currently have limited stock — only [Number] units left. This is a popular product and it tends to sell out quickly, so if it meets your needs, we recommend placing the order as soon as you are ready to avoid it going out of stock.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>7. 产品对比说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问不同产品的区别\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Great question about the difference between [Product A] and [Product B]. [Product A] is better for [Use Case 1], while [Product B] performs better for [Use Case 2]. The main differences are: [Difference 1], [Difference 2], and [Difference 3]. Based on your needs, I'd be happy to recommend one of them — if you can share a bit more about how you plan to use it, I can give you a more specific suggestion.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>8. 优惠活动说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问当前优惠\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! We currently have a promotion for this item: [Promotion Details]. You can check the promotion section on the product page and apply the coupon at checkout to enjoy the discount. If you are not sure how to use the offer, please let us know and we can guide you step by step.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>9. 产品规格咨询\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问产品详细规格\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for your question about [Specification]. The [Product Name] has the following key specifications: [Spec 1], [Spec 2], [Spec 3]. More detailed information is listed in the product description section of the page. If you need any additional details or have a specific use case, please let me know and I'll be happy to help.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>10. 购买保障说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户担心购买风险\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! When you purchase from us on Amazon, you are covered by both Amazon's order protection and our shop's after-sales service. If you experience any issues with your order — such as damage, missing items, or the product not matching the description — please contact us through Amazon messages and we will work with you to find a solution, including replacement or refund in line with Amazon's policies.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>响应速度\u003c/strong>：Amazon 要求 24 小时内回复，建议使用快捷回复工具\u003c/p>\n\u003cp>2. \u003cstrong>专业友好\u003c/strong>：保持礼貌和专业，避免生硬的模板感\u003c/p>\n\u003cp>3. \u003cstrong>信息准确\u003c/strong>：确保 Prime、FBA 等信息与实际一致\u003c/p>\n\u003cp>4. \u003cstrong>避免过度承诺\u003c/strong>：不要使用&quot;绝对&quot;、&quot;100%&quot;等绝对化表述\u003c/p>\n\u003chr />\n\u003cp>\u003cstrong>更多快语AI话术模板：\u003c/strong> [https://www.talkq.vip/templates/](https://www.talkq.vip/templates/)\u003c/p>"},{"id":"platforms/amazon/sales","path":"platforms/amazon/sales.md","title":"Amazon 售中客服话术","group":"platforms","groupLabel":"平台话术","categoryLabel":"Amazon · 售中","html":"\u003ch1>Amazon 售中客服话术\u003c/h1>\n\u003cblockquote>专业的 Amazon 售中客服话术模板，涵盖订单确认、物流追踪、支付处理、订单修改等场景。\u003c/blockquote>\n\u003ch2>使用说明\u003c/h2>\n\u003cul>\n\u003cli>话术中的 \u003ccode>[变量]\u003c/code> 需要根据实际情况替换\u003c/li>\n\u003cli>建议配合快捷回复软件使用，提升响应速度\u003c/li>\n\u003cli>售中问题建议在 2 小时内响应，避免客户焦虑\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2>1. 订单确认\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户下单后主动发送确认信息\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for your order. Your order number is [Order Number]. The item will be shipped via Amazon FBA, and you will be able to see the latest shipping status directly in your Amazon account under &quot;Your Orders&quot;. If you have any questions during the process, please feel free to contact us via Amazon messages.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>2. 发货延迟处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 物流出现延迟，需要向客户解释\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I apologize for the shipping delay. I've checked your order and confirmed that it is being processed, but the carrier is currently experiencing a slight delay. We are closely monitoring the shipment and will keep you updated. If it does not move within [X] days, please let us know and we will work with Amazon and the carrier to resolve it for you.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>3. 物流追踪\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问物流进度、追踪号码\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Your order [Order Number] has been shipped. The tracking number is [Tracking Number]. You can track your package on Amazon's &quot;Your Orders&quot; page or on the carrier's website using this tracking number. If the tracking information does not update for a while, please contact us and we will help you follow up with the carrier.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>4. 支付问题处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户支付失败或有支付疑问\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I see there might be an issue with your payment for this order. Please double-check that your card information, billing address, and available balance are correct in your Amazon account. In many cases, Amazon will automatically retry the payment. If the problem continues, you may try a different payment method or contact Amazon customer service for further assistance, and we'll be here to help from our side as well.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>5. 订单修改\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要求修改订单信息\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand you would like to change your order details. Once an Amazon order is in processing or shipped status, we usually cannot directly modify the items or quantities. If your order has not been shipped yet, you can try to cancel it in &quot;Your Orders&quot; and place a new order with the correct information. If it has already been shipped, please let us know your specific request and we will suggest the best solution for you.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>6. 地址确认\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 发货前确认客户收货地址\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I wanted to confirm your shipping address before we ship your order. The address on file is: [Address]. Is this correct? If you need to update it, please do so in your Amazon account as soon as possible. Once the order enters the shipping process, we may no longer be able to change the address, and the package will be sent to the address currently shown in your order.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>7. 预计送达时间\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问预计送达日期\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for your order. Based on your shipping address and the shipping method you selected, your estimated delivery date is [Date]. This is an estimate provided by Amazon and may vary slightly depending on the carrier's actual performance and local conditions. You can always check the latest estimated delivery date on your order details page on Amazon.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>8. 订单状态查询\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问订单当前状态\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I've checked the status of your order [Order Number]. It is currently in the status of [Current Status]. You can also view this information in your Amazon account under &quot;Your Orders&quot;. If the status does not change for an unusually long time, please let us know and we will help you investigate further.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>9. 合并订单\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户希望多个订单合并发货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I see you placed multiple orders and would like to have them shipped together. Whether orders can be combined depends on Amazon's system, warehouse location, and shipping method. If Amazon supports combining them, it will automatically arrange shipment in one package when possible. We, as the seller, generally cannot manually merge orders, but if you tell us your order numbers, we can check and give you more specific information.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>10. 催单处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户催促发货或送达\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand you are concerned about the delivery time. I've checked your order and confirmed that it is on the way. We will keep an eye on the tracking information and follow up with the carrier if there are any unusual delays. If the package does not arrive by [Latest Date], please contact us again and we will help you with further solutions, such as replacement or refund according to Amazon's policies.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>主动通知\u003c/strong>：订单确认和发货通知要主动发送，不要等客户询问\u003c/p>\n\u003cp>2. \u003cstrong>信息准确\u003c/strong>：确保订单号、追踪号等信息准确无误\u003c/p>\n\u003cp>3. \u003cstrong>及时响应\u003c/strong>：售中问题要在 2 小时内响应，避免客户焦虑\u003c/p>\n\u003cp>4. \u003cstrong>避免模糊\u003c/strong>：不要使用&quot;尽快&quot;、&quot;马上&quot;等模糊表述，给出具体时间\u003c/p>\n\u003chr />\n\u003cp>\u003cstrong>更多快语AI话术模板：\u003c/strong> [https://www.talkq.vip/templates/](https://www.talkq.vip/templates/)\u003c/p>"},{"id":"platforms/amazon/aftersales","path":"platforms/amazon/aftersales.md","title":"Amazon 售后客服话术","group":"platforms","groupLabel":"平台话术","categoryLabel":"Amazon · 售后","html":"\u003ch1>Amazon 售后客服话术\u003c/h1>\n\u003cblockquote>专业的 Amazon 售后客服话术模板，涵盖退换货处理、A-to-Z 纠纷、质量问题、评价引导等场景。\u003c/blockquote>\n\u003ch2>使用说明\u003c/h2>\n\u003cul>\n\u003cli>话术中的 \u003ccode>[变量]\u003c/code> 需要根据实际情况替换\u003c/li>\n\u003cli>Amazon 要求 24 小时内回复客户消息\u003c/li>\n\u003cli>A-to-Z 索赔要在 48 小时内响应，避免影响账号健康度\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2>1. 退货政策说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问退货政策或要求退货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! We offer a 30-day return policy for most items. If you are not completely satisfied with your purchase, you can initiate a return request through your Amazon account under &quot;Your Orders&quot;. Please make sure the item is in its original condition and packaging, unless it arrived damaged or defective. If you need any help with the return steps, feel free to let us know.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>2. A-to-Z 纠纷处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户威胁或已开启 A-to-Z 索赔\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand you have concerns about your order. We'd like to help resolve this as smoothly as possible. Please share a brief description of the issue and any relevant photos if available. If we are unable to find a solution that works for you, you can also open an A-to-z Guarantee claim through Amazon, and Amazon will review the case and help protect your rights as a buyer.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>3. 产品评价引导\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 售后满意时，引导客户留评\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for your purchase. We hope you are enjoying your [Product Name]. If everything meets your expectations, we would really appreciate it if you could take a moment to leave a product review on Amazon. Your feedback helps other customers make decisions and also encourages us to keep improving. If there is anything that is not ideal, please contact us first and we will do our best to make it right.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>4. 退款处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户申请退款，说明退款流程\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I have received your refund request. Once the returned item is received and inspected by Amazon or our warehouse (depending on the return method), your refund will be processed to your original payment method. This usually takes a few business days. We will keep an eye on the progress, and if you do not see the refund after [X] days, please contact us so we can help you follow up.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>5. 换货处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户要求换货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand you would like to exchange your item. On Amazon, exchanges are often handled as a return plus a new order. Please initiate a return request for the current item through your Amazon account, and once the return is accepted, you can place a new order for the item you prefer. If you tell us more about the issue, we can also suggest the most suitable replacement option for you.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>6. 商品质量问题\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户收到破损或有缺陷的商品\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I sincerely apologize that you received a defective item. This is not the standard we strive for. Please send us a brief description of the problem along with clear photos or a short video if possible. We will review it quickly and offer you a suitable solution, such as a replacement, partial refund, or full refund, in line with Amazon's policies and your preference.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>7. 商品不符处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户收到的商品与描述不符\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I apologize that you received the wrong or not-as-described item. This was our mistake, and we take it seriously. Please provide a photo of what you received, and we will arrange a solution as soon as possible — for example, sending the correct item or issuing a refund, depending on your choice and Amazon's rules.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>8. 退货标签提供\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户需要退货标签\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I can help you with the return label. Once your return request is approved through Amazon, you will usually see a prepaid return label or QR code provided by Amazon on the return page. Please print the label (or use the QR code at the designated drop-off location), attach it securely to the package, and send the item back. If you have any difficulty downloading or printing the label, please let us know.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>9. 部分退款\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 提供部分退款作为补偿\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand the issue you mentioned and I'm sorry for the inconvenience caused. As a solution, we can offer you a partial refund of [Amount] while you keep the item, so you don't need to go through the return process. If this is acceptable to you, please confirm, and we will submit the partial refund request through Amazon as soon as possible.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>10. 客户满意度回访\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 售后问题解决后回访客户\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I wanted to follow up on your recent purchase of [Product Name]. How are you enjoying it? Is everything working as expected? If you have any questions or concerns, please don't hesitate to contact us via Amazon messages. We are always here to help and want to make sure you are fully satisfied with your purchase.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>11. FBA 配送延迟说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> Amazon FBA 订单送达时间晚于预期\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I checked your order and can confirm that the shipment is currently delayed in Amazon's fulfillment network.\n\nCurrent status: [Status]\nLatest update: [Date/Time]\nNew estimated delivery date: [Date]\n\nBecause this order is handled through Amazon fulfillment, delivery timing is controlled by Amazon's logistics system. We are still monitoring the case closely from our side.\n\nIf the package does not arrive by [Follow-up Date], please message us again and we will help review the next available resolution under Amazon's process.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>12. WISMO 跟进回复\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问“我的订单到哪里了”\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for checking in on your order.\n\nAccording to the latest Amazon tracking update:\n• Order number: [Order Number]\n• Current status: [Status]\n• Last scan: [Date/Time]\n• Estimated delivery: [Date]\n\nAt this time, the package is still in transit. Tracking updates can occasionally pause between scans, but this does not always mean there is a problem.\n\nIf there is still no delivery or new tracking movement after [Timeframe], please let us know and we will continue assisting you.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>13. A-to-z 索赔降级沟通\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户准备发起索赔前先尝试协商\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand your concern and truly want to help resolve this as quickly as possible.\n\nBefore you take any further steps, please share the exact issue with the order, along with photos if relevant. Once we review the details, we will respond with the most appropriate solution available, such as replacement, refund, or return guidance in line with Amazon policy.\n\nWe appreciate the chance to address this for you directly and will do our best to make the process smooth.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>14. A-to-z 已开启后的材料引导\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户已经开启 A-to-z，需要说明后续\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand that an A-to-z Guarantee claim has already been opened for this order.\n\nTo help the review move forward smoothly, please make sure all relevant details are included in the claim, such as:\n• A short description of the issue\n• Photos or screenshots if applicable\n• The resolution you are seeking\n\nAmazon will review the case based on the order details and evidence provided. We will also cooperate fully within Amazon's process.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>15. 已送达未收到\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> Amazon 显示 delivered，但客户说没收到\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm sorry to hear that the order shows as delivered but you have not received it.\n\nPlease first check:\n• Around your mailbox, porch, front desk, or reception\n• With family members, neighbors, or building staff\n• Whether Amazon marked it delivered slightly early and it arrives within 24 hours\n\nIf it still does not appear after [Timeframe], please contact us again through Amazon messages, and we will help guide you through the next step within Amazon's support process.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>16. 部分退款确认\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户同意保留商品并接受部分退款\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for confirming that a partial refund works for you.\n\nWe will now submit a partial refund request for:\n• Order: [Order Number]\n• Amount: [Amount]\n• Reason: [Reason]\n\nOnce processed, the refund will be sent back to your original payment method through Amazon. Posting time may vary depending on your payment provider.\n\nIf you need anything else, feel free to message us.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>17. 退货在途说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户已经寄回商品，询问何时退款\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for the return update.\n\nAt the moment, your return is still in transit / being processed by Amazon's return system.\n\nIn most cases:\n• The return is scanned on arrival\n• The item is inspected\n• The refund is then issued to the original payment method\n\nIf you do not see a refund update after [Timeframe], please let us know and we will help you review the case.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>18. 更换方案说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户想更换尺码或款式\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand you'd like a different size or variation.\n\nOn Amazon, exchanges are usually handled by returning the current item and placing a new order for the preferred option.\n\nRecommended steps:\n1. Start the return from &quot;Your Orders&quot;\n2. Choose the return reason\n3. Place a new order for [Replacement Option]\n\nIf you'd like, I can also help confirm whether the replacement option is currently available before you reorder.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>19. FBA 破损包裹处理\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户收到外箱或商品破损，订单由 FBA 配送\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm very sorry that your FBA order arrived damaged.\n\nPlease send us:\n• A photo of the damaged item\n• A photo of the outer packaging\n• A brief description of the issue\n\nOnce we review the details, we will help guide you toward the most suitable resolution available for the order, such as return, replacement, or refund according to Amazon's process.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>20. 退款到账延迟说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> Amazon 已显示 refunded，但客户账户未看到\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I checked your case and the refund has already been processed through Amazon.\n\nRefund details:\n• Order: [Order Number]\n• Amount: [Amount]\n• Refund date: [Date]\n\nEven after the refund is issued, your bank or card provider may need additional time to post it to your statement.\n\nIf the amount still does not appear after [Timeframe], please contact your payment provider and feel free to message us again if you need confirmation details for reference.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>21. 承诺送达日未送达询问\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户引用承诺送达日（delivery promise）询问赔偿或进度\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for your message about order [Order Number].\n\nI reviewed the latest tracking information:\n• Current status: [Status]\n• Latest carrier update: [Date/Time]\n• Revised estimated delivery: [Date]\n\nBecause Amazon fulfillment and carrier operations can shift during transit, delivery dates may update as the package moves. If the shipment becomes significantly delayed or shows an exception, please message us again with a screenshot of the tracking page and we will help review the available resolution options under Amazon's policies.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>22. 已发货后买家申请取消\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 包裹已在途，客户要求取消订单\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand you'd like to cancel order [Order Number].\n\nAt this moment the shipment status is [Shipped/In transit/Delivered]. Once an order has shipped, cancellation is usually not possible through the seller side.\n\nIf you no longer want the item, the fastest path is to refuse delivery (if available in your region) or use the return option in your Amazon account under &quot;Your Orders&quot; once delivered. If you tell me your current tracking status, I can point you to the most suitable next step.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>23. 企业买家发票信息\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> Amazon Business 客户索要发票或税号信息\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thanks for reaching out about invoicing for order [Order Number].\n\nFor Amazon Business purchases, invoice and tax details are often available directly in your Amazon account:\n• Go to &quot;Your Orders&quot; → select the order → &quot;Invoice&quot; (if available)\n\nIf you need additional details such as [VAT/Tax ID/Company name], please tell us exactly what fields are required. We will provide what we can in line with Amazon's invoicing rules and respond within [Timeframe].\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>24. 超过退货窗口的善意复核\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 超过 30 天窗口，客户仍希望退货/退款\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for explaining your situation regarding order [Order Number].\n\nThe standard return window has passed, but we still want to review your request fairly. Please share:\n• A brief description of the issue\n• Photos (if quality-related)\n• The outcome you prefer (return/refund/replacement)\n\nWe cannot guarantee an exception, but we will review and reply within [Timeframe] with the best available option under Amazon policy.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>25. 多渠道配送（MCF）延迟说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 使用 MCF 的订单物流异常或延迟\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm sorry for the delay with order [Order Number].\n\nThis shipment is fulfilled through Amazon's multi-channel fulfillment network. Current tracking shows:\n• Status: [Status]\n• Last update: [Date/Time]\n\nWe are monitoring the shipment closely. If tracking does not progress after [Timeframe], please message us again and we will help review next steps such as re-shipment or refund, depending on eligibility and Amazon's fulfillment outcome.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>26. Amazon Locker 取件问题\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> Locker 容量满、超时未取、取件码问题\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm sorry for the trouble with your Amazon Locker delivery for order [Order Number].\n\nLocker issues are usually resolved quickest through your delivery instructions in &quot;Your Orders&quot; (for example: extend pickup window or redirect delivery if Amazon offers that option for your shipment).\n\nIf you can share a screenshot of the error message and your current tracking status, I will help interpret the next step and guide you based on what Amazon shows for this shipment.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>27. 产品注册与厂保（非亚马逊渠道）\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问序列号注册、厂家保修\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thanks for your message about warranty registration for [Product Name].\n\nMany brands handle registration and manufacturer warranty directly. If your package includes a warranty card or QR code, that is usually the fastest path.\n\nIf you need purchase proof from Amazon, you can use your order invoice from &quot;Your Orders&quot;. If you tell us what the manufacturer requires (for example: invoice PDF, serial number format), we will confirm what we can provide within Amazon messaging rules.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>28. 礼品留言缺失或错误\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户投诉礼品留言未打印或内容错误\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm very sorry that the gift message did not arrive as expected for order [Order Number].\n\nPlease tell me what you expected to see versus what happened (missing/incorrect). If you have a photo of the packing slip or gift note area, that helps us review quickly.\n\nWe will work to make this right under Amazon's policies, which may include [Refund/Replacement/Partial refund], depending on what is possible for this item and fulfillment type.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>29. 订阅省（S&amp;S）发货与取消节奏\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> Subscribe &amp; Save 频率、跳过、取消后仍发货的疑问\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thanks for your question about Subscribe &amp; Save for order [Order Number].\n\nDelivery frequency and upcoming shipments are managed in your Amazon account under &quot;Subscribe &amp; Save&quot;. You can adjust delivery dates, skip a delivery, or cancel the subscription there.\n\nIf a shipment already processed before the cancellation took effect, you can still use the normal return process for that delivery if it meets return eligibility. If you tell me the delivery date shown on the order, I can help confirm the most accurate next step.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>30. 安全-T / 卖家保护相关中性说明\u003c/h2>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户提及 SAFE-T；保持中性、引导按亚马逊流程处理\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for your message regarding order [Order Number].\n\nAmazon provides buyer and seller protections through its standard programs and case review processes. If Amazon opens a case or request for documentation, the best path is to follow the instructions shown on the case page and provide any evidence requested (tracking, photos, messages).\n\nIf you share the current case type/status you see in your account, I can help explain the typical timeline and what information is most helpful for review.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>快速响应\u003c/strong>：Amazon 要求 24 小时内回复，A-to-Z 索赔要在 48 小时内响应\u003c/p>\n\u003cp>2. \u003cstrong>主动解决\u003c/strong>：在客户开启 A-to-Z 索赔前主动联系并解决问题\u003c/p>\n\u003cp>3. \u003cstrong>遵守规则\u003c/strong>：严禁好评返现、诱导评价等违规行为\u003c/p>\n\u003cp>4. \u003cstrong>保留证据\u003c/strong>：处理纠纷时保留聊天记录和图片证据\u003c/p>\n\u003chr />\n\u003cp>\u003cstrong>更多快语AI话术模板：\u003c/strong> [https://www.talkq.vip/templates/](https://www.talkq.vip/templates/)\u003c/p>"},{"id":"platforms/ebay/presales","path":"platforms/ebay/presales.md","title":"eBay  the condition or would like additional photos, please let me know. I want to make sure you're completely satisfied with your purchase!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>8. 运费说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家询问运费和配送方式\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Shipping for this item is [Cost] via [Shipping method]. We offer combined shipping discounts if you purchase multiple items - just add them to your cart and the discount will apply automatically. For international buyers, please check the shipping cost in the listing. If you have questions, feel free to ask!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>9. 商品尺寸咨询\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家询问商品尺寸\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thank you for your question about the dimensions. This item measures [Length] x [Width] x [Height] [Units]. I've also included detailed measurements in the listing description. If you need any specific measurements or have questions about fit, please let me know and I'll be happy to help!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>10. 批量购买优惠\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家询问批量购买折扣\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Yes, we offer discounts for bulk purchases! If you're interested in buying [Quantity] or more, I can offer you a special price. The more you buy, the better the discount. Please let me know your desired quantity and I'll provide you with the best price. Looking forward to your order!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>快速响应\u003c/strong>：1 小时内回复询盘，保持 Top Rated Seller 资格\u003c/p>\n\u003cp>2. \u003cstrong>专业礼貌\u003c/strong>：使用正式英语，避免缩写和俚语\u003c/p>\n\u00 3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家要求取消订单\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand you'd like to cancel your order. If the order hasn't shipped yet, I can cancel it immediately and you'll receive a full refund within 3-5 business days. If it's already shipped, you'll need to return it once received. Would you like me to proceed with the cancellation?\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>8. 发货延迟说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订单发货延迟需要解释\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I apologize for the delay in shipping your order. [Reason for delay]. Your order is now being prepared and will ship within [Timeframe]. You'll receive tracking information as soon as it ships. I appreciate your patience and apologize for any inconvenience!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>9. 订单状态查询\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家查询订单状态\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I've checked your order status. Order [Order Number] is currently [Status]. [Additional details]. You can also check your order status in your eBay account under &quot;Purchase History&quot;. If you have any questions or concerns, please let me know!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>10. 催单处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家催促发货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I understand you're waiting for your order. I've checked the status, and it's currently [Status]. We're working hard to get it to you as soon as possible. You'll receive tracking information as soon as it ships. Thank you for your patience!\u003c/pre>\u003c/div>\ e a confirmation email from eBay/PayPal. Thank you for your patience, and we hope to serve you again!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>3. Item Not Received 纠纷\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家开启未收到货纠纷\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'm sorry to hear you haven't received your item yet. I've checked the tracking and it shows [Status]. Sometimes packages can be delayed due to [Reason]. Please allow [X] more days for delivery. If it still doesn't arrive, I'll be happy to offer a full refund or send a replacement. Thank you for your patience!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>4. Item Not as Described 纠纷\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家开启货不对板纠纷\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I sincerely apologize that the item didn't meet your expectations. I want to make this right. Please send me photos of the issue so I can better understand the problem. I can offer you: 1) Full refund with return; 2) Partial refund to keep the item; 3) Replacement item. Which option works best for you?\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>5. 差评挽回\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家留下差评后主动联系\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I noticed you left negative feedback and I'm truly sorry about your experience. I want to make this right. I've [Solution Provided]. If you're satisfied with the resolution, would you consider revising your feedback? Your satisfaction is very important to us. Please let me know how I can help further.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>6. 评价引导\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订单完成后引导好评\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" ：\u003c/strong> 买家询问物流状态\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Track your package: 📱\n\nMethod 1: Lazada app → My Orders → Track\nMethod 2: Use tracking number [Number] on [Courier Website]\n\nCurrent Status:\n• Status: [Status]\n• Last update: [Time]\n• Estimated delivery: [Date]\n\nUpdates every 6-12 hours. Any issues? Let us know! 📍\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>6. 清关延迟说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 包裹在清关中\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Your package is in customs clearance. 🛃\n\nThis is normal for international shipments!\n\nDetails:\n• Typical clearance time: [Time] days\n• Current status: [Status]\n• No action needed from you\n\nWe're monitoring it. Once cleared, delivery resumes immediately.\n\nThank you for your patience! 🙏\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>7. 地址修改\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家要求修改收货地址\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Want to change delivery address?\n\nQuick! If order status is &quot;Pending&quot;, we can update it now.\n\nNew address: [Address]\n\nPlease confirm:\n✓ Address is correct\n✓ Within our delivery area\n\nAlready shipped? Contact the courier: [Courier Name] at [Contact].\n\nWe'll assist! 📍\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>8. 订单取消\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家要求取消订单\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>To cancel your order:\n\nSteps:\nLazada app → My Orders → Select order → Cancel Order → Choose reason\n\nStatus Guide:\n• &quot;Pending&quot;: Cancellation is instant\n• &quot;Shipped&quot;: Reject delivery or return after receiving\n\nRefund: Full amount to original payment method.\n\nNeed help? Chat us! 💬\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>9. 配送延迟道歉\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 物流延迟需要道歉\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>We sincerely apologize for the delay! 🙏\n\nDelay Details:\n• Reason: [Reason]\n• Original ETA: [Date]\n• New ETA: [Date]\n\nWhat We're Doing:\n• Contacted courier to expedite delivery\n• Monitoring your package closely\n\nCompensation: [Voucher/Discount] for your next purchase.\n\nThank you for your understanding! 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>10. 催单处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家催促发货/送达\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>We understand you're eager to receive your order! 🤗\n\nOrder Status:\n• Current status: [Status]\n• Shipped on: [Date]\n• Current location: [Location]\n• ETA: [Date]\n\nWe've flagged this as priority with our logistics partner.\n\nTracking: [Number]\n\nAlmost there! 🚚\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch2>使用技巧\u003c/h2>\n\u003cp>1. \u003cstrong>主动通知\u003c/strong>：发货后立即通知，不要等买家来问\u003c/p>\n\u003cp>2. \u003cstrong>清关说明\u003c/strong>：东南亚跨境订单常有清关，提前说明\u003c/p>\n\u003cp>3. \u003cstrong>多渠道追踪\u003c/strong>：提供 Lazada App 和物流官网两种追踪方式\u003c/p>\n\u003cp>4. \u003cstrong>快速响应\u003c/strong>：订单修改要快速处理，避免已发货后才响应\u003c/p>\n\u003cp>5. \u003cstrong>延迟补偿\u003c/strong>：物流延迟时主动提供优惠券补偿\u003c/p>\n\u003chr />\n\u003cp>\u003cstrong>更多快语AI话术模板：\u003c/strong> [https://www.talkq.vip/templates/](https://www.talkq.vip/templates/)\u003c/p>"},{"id":"platforms/lazada/aftersales","path":"platforms/lazada/aftersales.md","title":"Lazada 售后客服话术","group":"platforms","groupLabel":"平台话术","categoryLabel":"Lazada · 售后","html":"\u003ch1>Lazada 售后客服话术\u003c/h1>\n\u003cblockquote>专业的 Lazada 东南亚电商售后客服话术模板，涵盖退换货处理、质量问题、包裹丢失、评价引导等售后服务场景。\u003c/blockquote>\n\u003ch2>使用说明\u003c/h2>\n\u003cul>\n\u003cli>话术中的 \u003ccode>[变量]\u003c/code> 需要根据实际情况替换\u003c/li>\n\u003cli>LazMall 卖家享有 15 天免费退货政策\u003c/li>\n\u003cli>主动提供解决方案，避免纠纷升级\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2>Lazada 售后话术列表（共 15 条）\u003c/h2>\n\u003ch3>1. 退货政策说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家咨询退货流程\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Our return policy: 15-Day Free Returns for LazMall products! 📦\n\nProcess:\nLazada app → My Orders → Return/Refund → Select reason → Submit\n\nBenefits:\n✓ Free return shipping label\n✓ Refund processed within [Time] days after we receive the item\n\nEasy &amp; hassle-free! ✨\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>2. 质量问题处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家反馈商品有质量问题\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>We're very sorry about the quality issue! 😔\n\nPlease send us photos/videos of the defect.\n\nWe'll immediately:\n1) Arrange free return pickup\n2) Issue full refund OR send replacement - your choice!\n\nNo need to wait for return. We'll process refund right away.\n\nWe apologize! 💙\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>3. 商品不符处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 收到的商品与描述不符\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Item doesn't match description? We sincerely apologize! 🙏\n\nPlease provide:\n1) Photos of received item\n2) Photos showing the difference\n\nWe'll offer:\n• Option A: Full refund + keep item\n• Option B: Free replacement + return label\n\nYou decide! Your satisfaction matters! 💝\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>4. 换货流程\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家申请换货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Need an exchange? No problem! 👕\n\nSteps:\nMy Orders → Return/Refund → Select &quot;Exchange&quot; → Choose new size/color\n\nProcess:\n• We'll ship the replacement immediately\n• Arrange free pickup for the original item\n\nOr get a refund and reorder. Both options available! 🔄\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>5. 退款处理时间\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 通知买家退款进度\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Your refund is being processed! 💰\n\nTimeline:\n• Return received: [Date]\n• Refund initiated: [Date]\n• Refund method: [Lazada Wallet/Original Payment]\n• Processing time: [Time] days\n\nYou'll receive notification when completed. Check &quot;My Orders&quot; for status.\n\nThank you for your patience! 🙏\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>6. 包裹丢失处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家反馈包裹丢失\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Package lost or not delivered? We're so sorry! 😢\n\nDon't worry - you're fully protected!\n\nWe'll:\n1) File claim with courier\n2) Issue immediate refund OR send replacement\n\nNo waiting required!\n\nRefund: [Amount] to [Method]\n\nWe take full responsibility! 🛡️\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>7. 包裹损坏处理\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 买家反馈包裹损坏\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Package arrived damaged? We're very sorry! 📦💔\n\nPlease send photos of:\n1) Damaged packaging\n2) Damaged product\n\nWe'll immediately:\n• Send replacement OR\n• Full refund - your choice!\n\nKeep the damaged item. This is our mistake. We'll improve our packaging! 💪\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>8. 评价引导\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 订单完成后引导好评\ ch to delivery\n✓ Secure packaging\n✓ Customs documentation (for international)\n\nNote: Import duties/taxes may apply for international orders and are the responsibility of the buyer.\n\nReady to order? Let me know if you have any questions!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>4. 产品咨询回复\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问产品详情\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Thanks for asking about [Product Name]!\n\nProduct Details:\n• Material: [Material]\n• Size: [Dimensions]\n• Color options: [Colors available]\n• Features: [Key features]\n\nThis product is perfect for [Use case]. It's one of our bestsellers with [X]+ 5-star reviews!\n\nWould you like me to help you choose the right [size/color/variant]? I'm happy to provide personalized recommendations!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>5. 尺码建议\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问尺码选择\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! I'd love to help you find the perfect size!\n\nOur Size Guide:\n[Size chart or link]\n\nQuick Tips:\n• This item runs [true to size / small / large]\n• For reference: Model is [Height] wearing size [Size]\n• Between sizes? We recommend sizing [up/down]\n\nNeed personalized advice? Share your measurements:\n• Height: \n• Weight:\n• Usual size in [Brand]:\n\nI'll recommend the best size for you! And remember, we offer free exchanges if it doesn't fit perfectly.\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>6. 折扣码咨询\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问是否有优惠\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Great timing - we do have some offers available!\n\nCurrent Promotions:\n🎉 New customer: [X]% off with code [Code]\n📦 Free shipping on orders over $[Amount]\n🛒 Bundle deal: Buy [X] get [Y]% off\n\nHow to Apply:\nEnter the code at checkout in the &quot;Discount Code&quot; field.\n\nPro tip: Sign up for our newsletter for exclusive deals and early access to sales!\n\nNeed help with anything else?\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>7. 退货政策说明\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户购买前询问退货政策\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! We want you to shop with complete confidence!\n\nOur Return Policy:\n• 30-day hassle-free returns\n• Items must be unused with original tags\n• Free returns for defective items\n• Easy online return process\n\nHow It Works:\n1. Request return in your account\n2. Print prepaid label (or pay return shipping)\n3. Drop off at any [Carrier] location\n4. Refund processed within 5-7 days\n\nWe stand behind our products 100%. If you're not happy, we'll make it right!\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>8. 库存查询\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问商品是否有货\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Let me check that for you!\n\n[Product Name] in [Size/Color]:\n✅ In Stock - Ready to ship!\n\nCurrent stock: [X] units available\nThis is a popular item and selling fast!\n\nWould you like me to:\n• Reserve one for you? (holds for 24 hours)\n• Notify you if it sells out and restocks?\n\nReady to order? Here's the direct link: [Product link]\u003c/pre>\u003c/div>\n\u003chr />\n\u003ch3>9. 定制服务咨询\u003c/h3>\n\u003cp>\u003cstrong>适用场景：\u003c/strong> 客户询问定制或批量购买\u003c/p>\n\u003cdiv class=\"script-block\">\u003cbutton type=\"button\" class=\"copy-btn\" data-copy>复制话术\u003c/button>\u003cpre>Hello! Yes, we offer customization services!\n\nCustomization Options:\n• Engraving/Personalization: +$[Amount]\n• Custom colors: Available for orders of [X]+\n• Logo/branding: Available f
